<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<title>Validações de Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: field-terminal console — summary strip on top, project list left, project sheet right (journey, then tabs: next step / history / checklist / data); agenda lists each project's single next step; stacks on phones */
:root {
  --bg: #edf0ea;
  --surface: #f9fbf7;
  --raised: #ffffff;
  --ink: #18231d;
  --muted: #5b685f;
  --line: #d2d9d0;
  --accent: #1e6a4e;
  --accent-soft: #dcebe2;
  --accent-ink: #ffffff;
  --ok: #2b7a4b;
  --ok-soft: #dcefe2;
  --fail: #b8382a;
  --fail-soft: #f6e0dc;
  --pend: #9a6c05;
  --pend-soft: #f4ead2;
  --na: #6f7a74;
  --na-soft: #e6e9e6;
  --info: #2f5f8f;
  --info-soft: #dfe8f2;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #151d19; --raised: #1b2520; --ink: #e2eae4; --muted: #94a39a;
    --line: #2a3630; --accent: #5cbf8e; --accent-soft: #1d3329; --accent-ink: #0b1510;
    --ok: #5cbf8e; --ok-soft: #1c3428; --fail: #ee7465; --fail-soft: #3a201c;
    --pend: #e2b44a; --pend-soft: #362c14; --na: #8c9892; --na-soft: #242c28;
    --info: #7fb0e0; --info-soft: #1c2a38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151d19; --raised: #1b2520; --ink: #e2eae4; --muted: #94a39a;
  --line: #2a3630; --accent: #5cbf8e; --accent-soft: #1d3329; --accent-ink: #0b1510;
  --ok: #5cbf8e; --ok-soft: #1c3428; --fail: #ee7465; --fail-soft: #3a201c;
  --pend: #e2b44a; --pend-soft: #362c14; --na: #8c9892; --na-soft: #242c28;
  --info: #7fb0e0; --info-soft: #1c2a38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app {
  display: flex; flex-direction: column; gap: 14px; max-width: 1360px; margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { min-width: 230px; }
.tabs button { font-weight: 600; padding: 7px 12px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--fail); color: var(--raised); font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--fail); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.banner { border: 1px solid var(--pend); background: var(--pend-soft); color: var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 13px; }

/* Summary strip */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.stat { padding: 10px 14px; border: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; background: transparent; text-align: left; }
button.stat:hover { background: var(--raised); }
.stat:first-child { border-left: 0; }
.stat .n { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.stat.warn .n { color: var(--pend); }
.stat.bad .n { color: var(--fail); }
.stat.info .n { color: var(--info); }

/* Main split */
.main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 14px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }

/* List */
.list-head { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; min-width: 0; }
.field-in, select.field-in { width: 100%; border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 6px 9px; }
.field-in:focus { border-color: var(--accent); outline: none; }
.items { display: flex; flex-direction: column; max-height: calc(100vh - 260px); min-height: 200px; overflow-y: auto; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 11px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.item:hover { background: var(--raised); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .tt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub, .item .nx { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .nx b { font-weight: 500; color: var(--ink); }
.item .meta { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.kind { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .04em; border-radius: 4px; padding: 2px 5px; align-self: start; margin-top: 2px; }
.kind.hom { background: var(--info-soft); color: var(--info); }
.kind.val { background: var(--pend-soft); color: var(--pend); }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; align-self: start; }
.st-planejado { background: var(--na-soft); color: var(--na); }
.st-agendado { background: var(--info-soft); color: var(--info); }
.st-andamento { background: var(--accent-soft); color: var(--accent); }
.st-aguardando { background: var(--pend-soft); color: var(--pend); }
.st-aprovado { background: var(--ok-soft); color: var(--ok); }
.st-reprovado { background: var(--fail-soft); color: var(--fail); }
.st-cancelado { background: var(--na-soft); color: var(--na); text-decoration: line-through; }
.tag-ex { font-size: 10.5px; border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 0 4px; }
.stage-mini { display: inline-flex; gap: 2px; }
.stage-mini i { width: 9px; height: 4px; border-radius: 1px; background: var(--line); display: block; }
.stage-mini i.on { background: var(--accent); }
.stage-mini i.pend { background: var(--pend); }
.late { color: var(--fail); font-weight: 600; }
.today { color: var(--pend); font-weight: 600; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--ink); font-size: 15px; }

/* New project form */
.newform { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--raised); }
.newform label { font-size: 12px; color: var(--muted); }

/* Detail */
.detail { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 24px; }
.d-head { display: flex; flex-direction: column; gap: 10px; }
.d-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.d-top .spacer { flex: 1; }
.back { display: none; }
fieldset.fs { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
.d-head2 { display: flex; flex-direction: column; gap: 8px; margin-top: -12px; }
.title-in { font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.1; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; width: 100%; }
.title-in:hover { border-color: var(--line); }
.title-in:focus { border-color: var(--accent); outline: none; background: var(--raised); }
.d-sub { color: var(--muted); font-size: 13.5px; }
.d-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.d-ctrl label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.d-ctrl select { min-width: 170px; }
.who { font-size: 12px; color: var(--muted); }
.confirm { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--fail-soft); padding: 6px 10px; border-radius: 6px; flex-wrap: wrap; }

.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 17px; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.sec-h .aside { color: var(--muted); font-size: 12.5px; flex: 1; }

/* Journey stepper */
.journey { overflow-x: auto; padding: 4px 2px 6px; }
.steps { display: flex; min-width: max-content; list-style: none; margin: 0; padding: 0; }
.step { flex: 1 0 96px; }
.step button { width: 100%; border: 0; background: transparent; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 0 8px 0 0; text-align: left; color: var(--muted); font-size: 12.5px; line-height: 1.25; }
.step .node { width: 100%; display: flex; align-items: center; }
.step .dotn { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); flex: none; }
.step .ln { height: 2px; background: var(--line); flex: 1; margin-left: 4px; }
.step:last-child .ln { visibility: hidden; }
.step.done .dotn { background: var(--accent); border-color: var(--accent); }
.step.done .ln { background: var(--accent); }
.step.cur .dotn { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.cur button { color: var(--ink); font-weight: 600; }
.step.done button { color: var(--ink); }
.step button:hover .dotn { border-color: var(--accent); }
.step .sd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.step.pend .dotn { background: var(--pend-soft); border-color: var(--pend); border-style: dashed; }
.step.pend .ln { background: var(--accent); }
.step.pend button { color: var(--ink); }
.step .pl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--pend); }
.stage-panel { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.stage-panel .sp-q { font-size: 13.5px; }
.sp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 0; border-top: 1px dashed var(--line); }
.sp-row .seg { flex: 0 0 auto; }
.sp-row .seg button[data-v="pend"][aria-pressed="true"] { background: var(--pend-soft); color: var(--pend); }
.pend-list { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; background: var(--pend-soft); border-radius: 6px; padding: 6px 10px; }
.pend-list b { color: var(--pend); }
.since { font-size: 12.5px; color: var(--muted); }
.suggest { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--info-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px; }

/* Detail tabs */
.dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: -12px; }
.dtabs button { border: 0; background: transparent; padding: 8px 12px 9px; font-family: var(--f-display); font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.dtabs button:hover { color: var(--ink); }
.dtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.dtabs .cnt { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0; background: var(--na-soft); color: var(--muted); border-radius: 9px; padding: 0 6px; line-height: 17px; }
.dtabs .cnt.late { background: var(--fail); color: var(--raised); }
.dtabs .cnt.today { background: var(--pend); color: var(--raised); }
.dtabs .cnt.warn { background: var(--pend-soft); color: var(--pend); }

/* Next step */
.next-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 18px; border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--raised); border-radius: 8px; padding: 16px; }
.next-card.late { border-left-color: var(--fail); }
.next-card.today { border-left-color: var(--pend); }
.nc-when { display: flex; flex-direction: column; min-width: 92px; }
.nc-when .big { font-family: var(--f-display); font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.nc-when .rel { font-size: 12.5px; color: var(--muted); }
.next-card.late .big, .next-card.late .rel { color: var(--fail); }
.next-card.today .big, .next-card.today .rel { color: var(--pend); }
.nc-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.nc-body strong { font-size: 16px; overflow-wrap: anywhere; }
.nc-meta { font-size: 12.5px; color: var(--muted); }
.nc-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; }
.nc-actions label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.nc-actions input[type="date"] { width: auto; }
.box { border: 1px solid var(--line); border-radius: 8px; background: var(--raised); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.box h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.box .row-end { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sched { display: flex; flex-direction: column; gap: 8px; }
.sched.off .sched-what { opacity: .4; pointer-events: none; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.quick input[type="date"] { width: auto; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.last { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.last b { color: var(--ink); font-weight: 500; }
.suggest { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--info-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.tag.contato, .tag.ligacao { background: var(--info-soft); color: var(--info); }
.tag.visita { background: var(--accent-soft); color: var(--accent); }
.tag.mensagem { background: var(--na-soft); color: var(--na); }
.tag.teste, .tag.tarefa { background: var(--pend-soft); color: var(--pend); }
.tag.nota { background: var(--na-soft); color: var(--muted); }
.tag.etapa { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.tag.feito { background: transparent; color: var(--ok); border: 1px solid var(--ok); }
.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
/* Diary */
.log { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
.entry .when { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); padding-top: 1px; }
.entry .by { display: block; font-family: var(--f-body); font-size: 11.5px; margin-top: 2px; }
.entry .what { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry.auto .what { color: var(--muted); font-size: 13px; }
.log-add { display: grid; grid-template-columns: 140px 160px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.log-add textarea { min-height: 38px; resize: vertical; }

/* Checklist */
.prog { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 10px; border-radius: 5px; background: var(--na-soft); display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; transition: width .25s; }
.mini { flex: 0 1 100px; height: 5px; border-radius: 3px; background: var(--na-soft); display: flex; overflow: hidden; min-width: 40px; }
.mini i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.c-ok { background: var(--ok); } .c-fail { background: var(--fail); } .c-na { background: var(--na); } .c-pend { background: var(--pend-soft); border: 1px solid var(--pend); }
.group { display: flex; flex-direction: column; }
.group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 0 4px; font-weight: 600; }
.ck { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 10px; align-items: center; padding: 7px 0; border-top: 1px dashed var(--line); }
.ck .txt { min-width: 0; }
.ck.s-ok .txt { color: var(--muted); }
.ck.s-fail .txt { color: var(--fail); font-weight: 500; }
.tri { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tri button { border: 0; border-left: 1px solid var(--line); background: var(--raised); padding: 3px 9px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 44px; }
.tri button:first-child { border-left: 0; }
.tri button.on-ok { background: var(--ok); color: var(--raised); }
.tri button.on-fail { background: var(--fail); color: var(--raised); }
.tri button.on-na { background: var(--na); color: var(--raised); }
.icon-btn { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.icon-btn:hover { color: var(--ink); background: var(--na-soft); }
.icon-btn.has { color: var(--accent); }
.ck .note { grid-column: 1 / -1; }
.ck .note input { font-size: 13px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.add-row input { flex: 3 1 220px; }
.add-row select { flex: 1 1 140px; }
details.fold > summary { cursor: pointer; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const isoOf = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
  const todayISO = () => isoOf(new Date());
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
  const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d && m ? `${d}/${m}/${y.slice(2)}` : iso; };
  const daysFrom = (iso) => { if (!iso) return null; const a = new Date(iso + "T00:00:00"); const b = new Date(todayISO() + "T00:00:00"); return Math.round((a - b) / 86400000); };
  const relDay = (iso) => { const d = daysFrom(iso); if (d === null) return ""; if (d === 0) return "hoje"; if (d === 1) return "amanhã"; if (d === -1) return "ontem"; return d < 0 ? `atrasado ${-d} dias` : `em ${d} dias`; };

  async function hydrateNames() {
    if (!userApi) return;

  /* ---------- Storage adapters ---------- */
  function dbStore(db) {
    const col = db.collection("projects");
    return {
      subscribe(cb, onErr) { return col.onSnapshot((snap) => cb(snap.docs.map((d) => ({ id: d.id, data: d.data() }))), onErr); },
      set(id, data) { return col.doc(id).set(data); },
      update(id, patch) { return col.doc(id).update(patch); },
      del(id) { return col.doc(id).delete(); },
      newId() { return col.doc().id; },

  }
  function localStore() {

    const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
    const write = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
    const emit = () => { const o = read(); cb && cb(Object.keys(o).map((id) => ({ id, data: o[id] }))); };
    return {
      subscribe(f) { cb = f; setTimeout(emit, 0); return () => { cb = null; }; },
      set(id, data) { const o = read(); o[id] = data; write(o); return Promise.resolve(); },

  function scheduleSave(id, delay) {

      const body = clone(p);
      op = () => store.set(id, body);
    } else {
      const patch = { updated: p.updated };
      if (state.myId) patch.updatedBy = state.myId;
      s.fields.forEach((k) => { patch[k] = p[k] === null ? null : clone(p[k]); });
      op = () => store.update(id, patch);
    }
    s.isNew = false; s.fields = new Set();
    s.inflight++;
    s.chain = s.chain
      .then(op)
      .catch((e) => {
        const code = e && e.code;
        if (code === "not_found" || (code === "invalid_argument" && state.canWrite === true)) toast("Este projeto foi excluído por outra pessoa.");
        else if (code === "invalid_argument") { setReadOnly(true); toast("Você não tem permissão para editar."); }
        else toast(code === "quota_exceeded" ? "Armazenamento cheio: apague projetos antigos." : "Não foi possível salvar. Verifique a conexão e tente de novo.");
      })
      .finally(() => { s.inflight--; updateSaving(); });
    updateSaving();
  }
  function changed(id, fields, opts) {
    if (state.readOnly) return;
    const s = saver(id);
    (fields || []).forEach((f) => s.fields.add(f));
    scheduleSave(id, opts && opts.now ? 0 : 700);
    renderSummary(); renderList();
    if (state.view === "agenda") renderAgenda();
    if (opts && opts.detail) renderDetail();
  }

  function onSnapshot(rows) {
    const seen = new Set();
    rows.forEach(({ id, data }) => {
      seen.add(id);
      if (!busy(id)) state.projects.set(id, Object.assign({ checklist: [], diario: [], etapasHist: [], etapasPend: [], proximo: null }, clone(data)));
    });
    for (const id of Array.from(state.projects.keys())) if (!seen.has(id) && !busy(id)) state.projects.delete(id);
    state.loaded = true;
    if (state.selectedId && !state.projects.has(state.selectedId)) state.selectedId = null;
    renderSummary(); renderList();
    if (!$("#detail").contains(document.activeElement)) renderDetail();
    if (state.view === "agenda" && !$("#agenda").contains(document.activeElement)) renderAgenda();
  }

  /* ---------- Domain actions ---------- */
  // marks: { stageKey: "ok" | "pend" } for the stages passed over when moving ahead
  function setStage(id, k, marks) {
    const p = state.projects.get(id); if (!p || stageKey(p) === k) return;
    const st = stages(p).find((s) => s.k === k); if (!st) return;
    const pend = new Set(p.etapasPend || []);
    const novasPend = [];
    Object.keys(marks || {}).forEach((sk) => {
      if (marks[sk] === "pend") { if (!pend.has(sk)) novasPend.push(sk); pend.add(sk); } else pend.delete(sk);
    });
    pend.delete(k);
    p.etapa = k;
    p.etapasPend = Array.from(pend);
    p.etapasHist = (p.etapasHist || []).concat([{ etapa: k, data: todayISO(), autor: state.myId || "" }]);
    const nomes = novasPend.map((sk) => (stages(p).find((s) => s.k === sk) || {}).l).filter(Boolean);
    p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo: "etapa", texto: "Etapa: " + st.l + (nomes.length ? " (pendente: " + nomes.join(", ") + ")" : ""), autor: state.myId || "", auto: true }]);
    state.stagePanel = null;
    changed(id, ["etapa", "etapasPend", "etapasHist", "diario"], { detail: true, now: true });
  }
  function setPending(id, k, on) {
    const p = state.projects.get(id); if (!p) return;
    const st = stages(p).find((s) => s.k === k); if (!st) return;
    const pend = new Set(p.etapasPend || []);
    if (on) pend.add(k); else pend.delete(k);
    p.etapasPend = Array.from(pend);
    p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo: "etapa", texto: (on ? "Etapa pendente: " : "Etapa concluída: ") + st.l, autor: state.myId || "", auto: true }]);
    state.stagePanel = null;
    changed(id, ["etapasPend", "diario"], { detail: true, now: true });
  }
  function pendingStages(p) {
    const ci = stageIdx(p); const pend = new Set(p.etapasPend || []);
    return stages(p).filter((s, i) => i < ci && pend.has(s.k));
  }
  function readSched(prefix) {
    const none = $("#" + prefix + "-none");
    if (none && none.value === "1") return null;
    const texto = ($("#" + prefix + "-texto").value || "").trim();
    const tipo = $("#" + prefix + "-tipo").value || "contato";
    const prazo = $("#" + prefix + "-prazo").value || "";
    if (!texto) { $("#" + prefix + "-texto").focus(); toast("Escreva o que precisa ser feito."); return false; }
    if (!prazo) { $("#" + prefix + "-prazo").focus(); toast("Escolha quando."); return false; }
    return { id: rid(), texto, tipo, prazo, criado: todayISO(), autor: state.myId || "" };
  }

  /* ---------- Rendering ---------- */
  function activeProjects() { return Array.from(state.projects.entries()).filter(([, p]) => !CLOSED.has(p.status) && stageKey(p) !== "encerrado"); }

  function renderSummary() {
    const act = activeProjects();
    const nexts = act.map(([, p]) => nextOf(p)).filter(Boolean);
    const late = nexts.filter((n) => { const d = daysFrom(n.prazo); return d !== null && d < 0; }).length;
    const today = nexts.filter((n) => daysFrom(n.prazo) === 0).length;
    const week = nexts.filter((n) => { const d = daysFrom(n.prazo); return d !== null && d > 0 && d <= 7; }).length;
    const sem = act.filter(([, p]) => !nextOf(p)).length;
    $("#strip").innerHTML = [
      `<button class="stat" data-action="view" data-v="projetos"><span class="n">${act.length}</span><span class="l">Projetos ativos</span></button>`,
      `<button class="stat ${late ? "bad" : ""}" data-action="view" data-v="agenda"><span class="n">${late}</span><span class="l">Atrasados</span></button>`,
      `<button class="stat ${today ? "warn" : ""}" data-action="view" data-v="agenda"><span class="n">${today}</span><span class="l">Para hoje</span></button>`,
      `<button class="stat ${week ? "info" : ""}" data-action="view" data-v="agenda"><span class="n">${week}</span><span class="l">Próximos 7 dias</span></button>`,
      `<button class="stat ${sem ? "warn" : ""}" data-action="view" data-v="agenda"><span class="n">${sem}</span><span class="l">Sem próximo passo</span></button>`,
    ].join("");
    const badge = late + today;
    $("#agenda-badge").innerHTML = badge ? `<span class="badge">${badge}</span>` : "";
  }

  function filtered() {
    const f = state.filter;
    const q = f.q.trim().toLowerCase();
    return Array.from(state.projects.entries())
      .map(([id, p]) => Object.assign({ id }, p))
      .filter((p) => f.tipo === "todos" || p.tipo === f.tipo)
      .filter((p) => f.status === "todos" || (f.status === "ativos" ? !CLOSED.has(p.status) : p.status === f.status))
      .filter((p) => {
        if (!q) return true;
        const hay = [p.titulo, p.cliente, p.fazenda, p.cidade, p.contato, p.maqFabricante, p.maqModelo, p.maqSerie, p.produto, p.versaoSw, p.versaoHw, p.release, p.engenharia].join(" ").toLowerCase();
        return hay.includes(q);
      })
      .sort((a, b) => {
        const ca = CLOSED.has(a.status) ? 1 : 0, cb = CLOSED.has(b.status) ? 1 : 0;
        if (ca !== cb) return ca - cb;
        const na = nextOf(a), nb = nextOf(b);
        const da = (na && na.prazo) || "9999", dbb = (nb && nb.prazo) || "9999";
        if (da !== dbb) return da < dbb ? -1 : 1;
        const r = (STATUS_RANK[a.status] ?? 9) - (STATUS_RANK[b.status] ?? 9);
        if (r) return r;
        return (b.updated || 0) - (a.updated || 0);
      });
  }

  function renderList() {
    const el = $("#items");
    if (!state.loaded) { el.innerHTML = `<div class="empty">Carregando projetos…</div>`; return; }
    const rows = filtered();
    if (!state.projects.size) {
      el.innerHTML = `<div class="empty"><strong>Nenhum projeto ainda</strong>Crie uma homologação em cliente ou uma validação de versão/hardware para começar a registrar a jornada.<button class="btn primary" data-action="new">+ Novo projeto</button></div>`;
      return;
    }
    if (!rows.length) { el.innerHTML = `<div class="empty">Nenhum projeto com esses filtros.</div>`; return; }
    el.innerHTML = rows.map((p) => {
      const c = counts(p);
      const nt = nextOf(p);
      const si = stageIdx(p);
      const pendSet = new Set(p.etapasPend || []);
      const mini = stages(p).map((s, i) => `<i class="${i < si && pendSet.has(s.k) ? "pend" : i <= si ? "on" : ""}"></i>`).join("");
      const nPend = pendingStages(p).length;
      const closed = CLOSED.has(p.status) || stageKey(p) === "encerrado";
      const nx = nt
        ? `<span class="nx">→ <b>${esc(nt.texto)}</b> · <span class="mono ${dueClass(nt.prazo)}">${fmtDate(nt.prazo)}</span></span>`
        : (closed ? "" : `<span class="nx today">Sem próximo passo</span>`);
      const fails = c.falha ? `<span class="late">${c.falha} falha${c.falha > 1 ? "s" : ""}</span>` : "";
      return `<button class="item" data-action="select" data-id="${esc(p.id)}" aria-current="${p.id === state.selectedId}">
        <span class="kind ${p.tipo === "validacao" ? "val" : "hom"}">${KIND[p.tipo] ? KIND[p.tipo].short : "?"}</span>
        <span class="tt">${esc(p.titulo || "Sem nome")}</span>
        <span class="pill st-${esc(p.status)}">${esc(statusLabel(p.status))}</span>
        <span class="sub">${esc(subline(p))}</span>
        ${nx}
        <span class="meta">${p.exemplo ? '<span class="tag-ex">exemplo</span>' : ""}<span class="stage-mini" aria-hidden="true">${mini}</span><span>${esc(stageLabel(p))}</span>${nPend ? `<span class="today">${nPend} etapa${nPend > 1 ? "s" : ""} pendente${nPend > 1 ? "s" : ""}</span>` : ""}${fails}</span>
      </button>`;
    }).join("");
  }

  function schedForm(prefix, p, opts) {
    const tipo = (opts && opts.tipo) || "contato";
    const days = 7;
    return `<div class="sched" id="${prefix}-sched">
      <input type="hidden" id="${prefix}-tipo" value="${tipo}">
      <input type="hidden" id="${prefix}-none" value="0">
      <div class="sched-what" style="display:flex;flex-direction:column;gap:8px">
        <div class="seg" role="group" aria-label="Tipo de passo">${NEXT_TIPOS.map((t) => `<button type="button" data-action="sched-tipo" data-prefix="${prefix}" data-v="${t.v}" aria-pressed="${t.v === tipo}">${t.l}</button>`).join("")}</div>
        <input class="field-in" id="${prefix}-texto" data-auto="1" value="${esc(defaultNextText(p, tipo))}" placeholder="O que precisa ser feito…" aria-label="O que fazer">
      </div>

        ${DAY_CHIPS.map((n) => `<button type="button" class="chip" data-action="sched-days" data-prefix="${prefix}" data-v="${n}" aria-pressed="${n === days}">${n} dias</button>`).join("")}
        <input class="field-in mono" type="date" id="${prefix}-prazo" data-prefix="${prefix}" value="${addDays(days)}" aria-label="Data">
        ${opts && opts.allowNone ? `<button type="button" class="chip" data-action="sched-none" data-prefix="${prefix}" aria-pressed="false">Sem próximo passo</button>` : ""}
      </div>
    </div>`;
  }

  function tabProximo(p, id) {
    const nt = nextOf(p);
    const le = lastEntry(p);
    const last = le ? `<div class="last">Último registro: <b>${fmtDate(le.data)}</b><span class="tag ${esc(le.tipo || "nota")}">${esc(LOG_LABEL[le.tipo || "nota"] || "Nota")}</span><span>${esc((le.texto || "").split("\n")[0])}</span><button class="link" data-action="tab" data-v="historico">ver histórico</button></div>` : "";
    const tel = p.tipo === "homologacao" && (p.contato || p.contatoTel) ? [p.contato, p.contatoTel].filter(Boolean).join(" · ") : (p.tipo === "validacao" && p.engenharia ? p.engenharia : "");

    if (nt && state.completing) {
      return `<div class="box">
        <h3>Como foi? — ${esc(nt.texto)}</h3>
        <div class="row2">
          <select class="field-in" id="cr-tipo" aria-label="Tipo de registro" style="flex:0 1 200px">${LOG_TIPOS.map((t) => `<option value="${t.v}" ${NEXT_TO_LOG[nt.tipo] === t.v ? "selected" : ""}>${t.l}</option>`).join("")}</select>
          <span></span>
        </div>
        <textarea class="field-in" id="cr-text" rows="3" placeholder="O que foi feito, o que o cliente disse, problemas…" aria-label="Resultado"></textarea>
        <h3>Qual o próximo passo?</h3>
        ${schedForm("cp", p, { allowNone: true, tipo: "contato" })}
        <div class="row-end"><button class="btn ghost" data-action="complete-cancel">Cancelar</button><button class="btn primary" data-action="complete-save">Salvar no histórico</button></div>
      </div>${last}`;
    }
    if (nt) {
      const dc = dueClass(nt.prazo);
      return `<div class="next-card ${dc}">
        <div class="nc-when"><span class="big">${esc(fmtDate(nt.prazo).slice(0, 5))}</span><span class="rel">${esc(relDay(nt.prazo))}</span></div>
        <div class="nc-body">
          <div><span class="tag ${esc(nt.tipo)}">${esc(NEXT_LABEL[nt.tipo] || "Tarefa")}</span></div>
          <strong>${esc(nt.texto)}</strong>
          ${tel ? `<span class="nc-meta mono">${esc(tel)}</span>` : ""}
          <span class="nc-meta">Agendado${nt.autor ? ` por <span data-uid="${esc(nt.autor)}">…</span>` : ""} em ${esc(fmtDate(nt.criado))}</span>
        </div>
        <div class="nc-actions">
          <button class="btn primary" data-action="complete-start">Feito — registrar como foi</button>
          <label for="next-date">Mudar data <input class="field-in mono" type="date" id="next-date" value="${esc(nt.prazo)}"></label>
          <button class="btn ghost danger" data-action="next-drop">Remover</button>
        </div>
      </div>
      <p class="hint">Um passo por vez: quando concluir, você anota como foi e já agenda o próximo.</p>
      ${last}`;
    }
    const suggest = FOLLOWUP_STAGES.has(stageKey(p)) ? `<div class="suggest">Projeto em acompanhamento: agende o próximo contato para ver como o cliente está.</div>` : "";
    return `${suggest}<div class="box">
        <h3>Agendar próximo passo</h3>
        ${schedForm("ns", p, { tipo: "contato" })}
        <div class="row-end"><button class="btn primary" data-action="next-save">Agendar</button></div>
      </div>
      ${last}`;
  }

  function tabHistorico(p) {
    const diario = (p.diario || []).slice().sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
    const log = diario.length
      ? diario.map((e) => {
          const tipo = e.tipo || "nota";
          return `<div class="entry ${e.auto ? "auto" : ""}"><span class="when">${esc(fmtDate(e.data))}${e.autor ? `<span class="by" data-uid="${esc(e.autor)}"></span>` : ""}</span>
          <span class="what"><span class="tag ${esc(tipo)}">${esc(LOG_LABEL[tipo] || "Nota")}</span>${esc(e.texto)}</span>
          ${e.auto ? "<span></span>" : `<button class="icon-btn" data-action="log-del" data-entry="${esc(e.id)}" aria-label="Apagar registro">×</button>`}</div>`;
        }).join("")
      : `<div class="entry"><span class="when">—</span><span class="what" style="color:var(--muted)">Nenhum registro ainda.</span><span></span></div>`;
    return `<p class="hint">Tudo o que já foi feito, do mais recente para o mais antigo. Para registrar algo fora do próximo passo, use o campo abaixo.</p>
      <div class="log-add">

        <select class="field-in" id="log-tipo" aria-label="Tipo de registro">${LOG_TIPOS.map((t) => `<option value="${t.v}" ${state.logTipo === t.v ? "selected" : ""}>${t.l}</option>`).join("")}</select>
        <textarea class="field-in" id="log-text" placeholder="O que foi feito, o que o cliente disse, problemas…" aria-label="Registro"></textarea>
        <button class="btn primary" data-action="log-add">Registrar</button>
      </div>
      <div class="log">${log}</div>`;
  }

  function tabChecklist(p) {
    const c = counts(p);
    const w = (n) => (c.total ? ((n / c.total) * 100).toFixed(1) : 0) + "%";
    const groups = [];
    const byGroup = {};
    (p.checklist || []).forEach((it) => { const g = it.grupo || "Geral"; if (!byGroup[g]) { byGroup[g] = []; groups.push(g); } byGroup[g].push(it); });
    const ck = groups.map((g) => `<div class="group"><div class="group-h">${esc(g)}</div>${byGroup[g].map((it) => {
      const showNote = state.openNotes.has(it.id) || it.nota || it.status === "falha";
      const b = (v, l, cls) => `<button data-action="ck-set" data-item="${esc(it.id)}" data-v="${v}" class="${it.status === v ? cls : ""}" aria-pressed="${it.status === v}">${l}</button>`;
      return `<div class="ck s-${it.status === "falha" ? "fail" : it.status}">
        <span class="txt">${esc(it.texto)}</span>
        <span class="tri" role="group" aria-label="Resultado">${b("ok", "OK", "on-ok")}${b("falha", "Falha", "on-fail")}${b("na", "N.A.", "on-na")}</span>
        <span><button class="icon-btn ${it.nota ? "has" : ""}" data-action="ck-note" data-item="${esc(it.id)}" title="Observação" aria-label="Observação">✎</button><button class="icon-btn" data-action="ck-del" data-item="${esc(it.id)}" title="Remover item" aria-label="Remover item">×</button></span>
        ${showNote ? `<div class="note"><input class="field-in" id="nt-${esc(it.id)}" data-note="${esc(it.id)}" value="${esc(it.nota)}" placeholder="${it.status === "falha" ? "Descreva a falha, como reproduzir, nº do ticket…" : "Observação"}"></div>` : ""}

    return `${c.total ? `<div class="prog">
        <div class="bar" aria-hidden="true"><i class="c-ok" style="width:${w(c.ok)}"></i><i class="c-fail" style="width:${w(c.falha)}"></i><i class="c-na" style="width:${w(c.na)}"></i></div>
        <div class="legend"><span><i class="dot c-ok"></i>OK <b>${c.ok}</b></span><span><i class="dot c-fail"></i>Falha <b>${c.falha}</b></span><span><i class="dot c-na"></i>N.A. <b>${c.na}</b></span><span><i class="dot c-pend"></i>Pendente <b>${c.pendente}</b></span></div>
      </div>` : `<div><button class="btn sm" data-action="ck-template">Usar checklist padrão</button></div>`}
      <div>${ck}</div>

        <select class="field-in" id="ck-group" aria-label="Grupo">${groupOpts}</select>

  function tabDados(p) {
    const fields = (FIELDS[p.tipo] || []).map((f) => {
      const v = p[f.k] == null ? "" : p[f.k];
      const idf = "fd-" + f.k;
      if (f.t === "area") return `<label class="wide" for="${idf}">${f.l}<textarea class="field-in" id="${idf}" data-field="${f.k}">${esc(v)}</textarea></label>`;
      return `<label for="${idf}">${f.l}<input class="field-in ${f.mono ? "mono" : ""}" id="${idf}" data-field="${f.k}" type="${f.t === "date" ? "date" : f.t === "number" ? "number" : "text"}" value="${esc(v)}"></label>`;
    }).join("");
    return `<div class="grid">${fields}</div>`;
  }

  function renderDetail() {
    const el = $("#detail");
    const id = state.selectedId;
    const p = id && state.projects.get(id);
    $("#app").classList.toggle("show-detail", !!p && state.view === "projetos");
    if (!p) {
      el.innerHTML = `<div class="placeholder"><strong>Selecione um projeto</strong>Escolha um projeto na lista para ver a jornada, o próximo passo e o histórico.</div>`;
      return;
    }
    const c = counts(p);
    const pct = c.total ? Math.round(((c.ok + c.na) / c.total) * 100) : 0;
    const nt = nextOf(p);
    const closed = CLOSED.has(p.status) || stageKey(p) === "encerrado";

    const si = stageIdx(p);
    const pendSet = new Set(p.etapasPend || []);
    const steps = stages(p).map((s, i) => {
      const since = stageSince(p, s.k);
      const isPend = i < si && pendSet.has(s.k);
      const cls = isPend ? "pend" : i < si ? "done" : i === si ? "cur" : "";
      return `<li class="step ${cls}"><button data-action="stage" data-v="${s.k}" ${i === si ? 'aria-current="step"' : ""} title="${i === si ? "Etapa atual" : "Abrir opções desta etapa"}">
        <span class="node"><span class="dotn"></span><span class="ln"></span></span>${esc(s.l)}${isPend ? `<span class="pl">Pendente</span>` : ""}${since && i <= si ? `<span class="sd">${fmtDate(since)}</span>` : ""}</button></li>`;
    }).join("");
    const pendNow = pendingStages(p);
    let panel = "";
    if (state.stagePanel && state.stagePanel !== stageKey(p)) {
      const st = stages(p); const ti = st.findIndex((s) => s.k === state.stagePanel);
      if (ti > si) {
        const rows = st.slice(si, ti).map((s) => {
          const v = pendSet.has(s.k) ? "pend" : "ok";
          return `<div class="sp-row" data-k="${s.k}"><span>${esc(s.l)}</span><div class="seg" role="group" aria-label="${esc(s.l)}">
            <button type="button" data-action="sp-mark" data-v="ok" aria-pressed="${v === "ok"}">Concluída</button>
            <button type="button" data-action="sp-mark" data-v="pend" aria-pressed="${v === "pend"}">Pendente</button></div></div>`;
        }).join("");
        panel = `<div class="stage-panel"><div class="sp-q">Avançar para <b>${esc(st[ti].l)}</b>. Como ficaram as etapas anteriores?</div>${rows}
          <div class="row-end" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-action="sp-cancel">Cancelar</button><button class="btn primary" data-action="sp-advance" data-v="${st[ti].k}">Avançar</button></div></div>`;
      } else if (ti >= 0) {
        const isPend = pendSet.has(st[ti].k);
        panel = `<div class="stage-panel"><div class="sp-q"><b>${esc(st[ti].l)}</b> — ${isPend ? "pendente" : "concluída"}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${isPend ? `<button class="btn primary" data-action="stage-done" data-v="${st[ti].k}">Marcar como concluída</button>` : `<button class="btn" data-action="stage-pend" data-v="${st[ti].k}">Marcar como pendente</button>`}
            <button class="btn" data-action="sp-back" data-v="${st[ti].k}">Voltar o projeto para esta etapa</button>
            <button class="btn ghost" data-action="sp-cancel">Fechar</button></div></div>`;
      }
    }
    const curSince = stageSince(p, stageKey(p));
    const subTxt = subline(p) + (p.tipo === "homologacao" && p.contatoTel ? " · " + p.contatoTel : "");

    const nCls = nt ? (dueClass(nt.prazo) || "") : (closed ? "" : "warn");
    const nTxt = nt ? (dueClass(nt.prazo) === "late" ? "atrasado" : fmtDate(nt.prazo).slice(0, 5)) : (closed ? "" : "nenhum");
    const nDiario = (p.diario || []).filter((e) => !e.auto).length;
    const tabs = [
      { k: "proximo", l: "Próximo passo", cnt: nTxt, cls: nCls },
      { k: "historico", l: "Histórico", cnt: String(nDiario), cls: "" },
      { k: "checklist", l: "Checklist", cnt: c.total ? (c.falha ? `${c.falha} falha${c.falha > 1 ? "s" : ""}` : pct + "%") : "", cls: c.falha ? "late" : "" },
      { k: "dados", l: "Dados", cnt: "", cls: "" },
    ];
    const tabBody = state.tab === "historico" ? tabHistorico(p) : state.tab === "checklist" ? tabChecklist(p) : state.tab === "dados" ? tabDados(p) : tabProximo(p, id);

    el.innerHTML = `<div class="detail">
      <div class="d-head">
        <div class="d-top">
          <button class="btn sm back" data-action="back">← Lista</button>
          <span class="kind ${p.tipo === "validacao" ? "val" : "hom"}">${KIND[p.tipo] ? KIND[p.tipo].short : "?"}</span>
          <span style="color:var(--muted);font-size:13px">${KIND[p.tipo] ? KIND[p.tipo].l : ""}</span>
          ${p.exemplo ? '<span class="tag-ex">exemplo</span>' : ""}
          <span class="spacer"></span>
          <button class="btn sm" data-action="report">Copiar relatório</button>
          <button class="btn sm ghost danger" data-action="del-ask">Excluir</button>
        </div>
        ${state.confirmDelete ? `<div class="confirm">Excluir “${esc(p.titulo || "Sem nome")}” com todo o histórico e checklist? <button class="btn sm danger" data-action="del-yes">Sim, excluir</button><button class="btn sm ghost" data-action="del-no">Cancelar</button></div>` : ""}
      </div>
      <fieldset class="fs" ${state.readOnly ? "disabled" : ""}>
      <div class="d-head2">
        <input class="title-in" id="fd-titulo" data-field="titulo" value="${esc(p.titulo)}" placeholder="Nome do projeto" aria-label="Nome do projeto">
        <div class="d-sub">${esc(subTxt)}</div>
        <div class="d-ctrl">
          <label for="fd-status">Status<select class="field-in" id="fd-status" data-field="status" data-rerender="1">${STATUS.map((s) => `<option value="${s.v}" ${p.status === s.v ? "selected" : ""}>${s.l}</option>`).join("")}</select></label>
          <label for="fd-prioridade">Prioridade<select class="field-in" id="fd-prioridade" data-field="prioridade">${PRIOR.map((s) => `<option value="${s.v}" ${p.prioridade === s.v ? "selected" : ""}>${s.l}</option>`).join("")}</select></label>
        </div>
        ${p.updatedBy ? `<div class="who">Última alteração por <span data-uid="${esc(p.updatedBy)}">…</span> em ${esc(fmtDateTime(p.updated))}</div>` : ""}
      </div>

      <section class="sec">
        <div class="sec-h"><h2>Jornada</h2><span class="aside">Clique numa etapa para avançar ou marcar como pendente. Tudo fica registrado no histórico.</span></div>
        <div class="journey"><ol class="steps">${steps}</ol></div>
        <div class="since">Etapa atual: <b>${esc(stageLabel(p))}</b>${curSince ? ` desde ${fmtDate(curSince)}` : ""}</div>
        ${pendNow.length ? `<div class="pend-list"><b>Pendente:</b>${pendNow.map((s) => `<span>${esc(s.l)}</span><button class="btn sm" data-action="stage-done" data-v="${s.k}">Concluir</button>`).join("")}</div>` : ""}
        ${panel}
      </section>

      <div class="dtabs" role="tablist" aria-label="Seções do projeto">
        ${tabs.map((t) => `<button role="tab" data-action="tab" data-v="${t.k}" aria-selected="${state.tab === t.k}">${t.l}${t.cnt ? `<span class="cnt ${t.cls}">${esc(t.cnt)}</span>` : ""}</button>`).join("")}
      </div>
      <section class="sec" role="tabpanel">${tabBody}</section>
      </fieldset>
    </div>`;
    const jr = el.querySelector(".journey"), cur = el.querySelector(".step.cur");
    if (jr && cur && cur.offsetLeft - jr.offsetLeft + cur.offsetWidth > jr.clientWidth) jr.scrollLeft = cur.offsetLeft - jr.offsetLeft - 24;
    hydrateNames();
  }

  function renderAgenda() {
    const el = $("#agenda");
    if (state.view !== "agenda") return;
    const act = activeProjects();
    let items = act.filter(([, p]) => nextOf(p)).map(([id, p]) => ({ id, p, n: nextOf(p) }));
    if (state.agendaTipo === "contato") items = items.filter((x) => x.n.tipo === "contato");
    items.sort((a, b) => (a.n.prazo < b.n.prazo ? -1 : a.n.prazo > b.n.prazo ? 1 : 0));
    const sem = act.filter(([, p]) => !nextOf(p));
    const row = (x) => {
      const p = x.p, n = x.n;
      const tel = p.tipo === "homologacao" ? p.contatoTel : "";
      return `<div class="arow">
        <span class="ad ${dueClass(n.prazo)}">${fmtDate(n.prazo)}<small>${esc(relDay(n.prazo))}</small></span>
        <div class="at"><span class="tag ${esc(n.tipo)}">${esc(NEXT_LABEL[n.tipo] || "Tarefa")}</span>${esc(n.texto)}
          <div class="sub">${esc(p.titulo || "Sem nome")}${p.cliente ? " · " + esc(p.cliente) : ""}${tel ? ` · <span class="mono">${esc(tel)}</span>` : ""}</div></div>
        <button class="btn sm" data-action="open" data-id="${esc(x.id)}">Abrir</button>
      </div>`;
    };
    const buckets = [
      { l: "Atrasados", cls: "late", f: (d) => d !== null && d < 0 },
      { l: "Hoje", cls: "today", f: (d) => d === 0 },
      { l: "Próximos 7 dias", cls: "", f: (d) => d !== null && d > 0 && d <= 7 },
      { l: "Mais adiante", cls: "", f: (d) => d !== null && d > 7 },
    ];
    let body = buckets.map((b) => {
      const list = items.filter((x) => b.f(daysFrom(x.n.prazo)));
      if (!list.length) return "";
      return `<div class="bucket"><div class="bucket-h ${b.cls}">${b.l} <span class="ct">${list.length}</span></div>${list.map(row).join("")}</div>`;
    }).join("");
    if (sem.length && state.agendaTipo === "todas") {
      body += `<div class="bucket"><div class="bucket-h today">Sem próximo passo <span class="ct">${sem.length}</span></div>${sem.map(([id, p]) => `<div class="arow">
        <span class="ad"><small>—</small></span>
        <div class="at">${esc(p.titulo || "Sem nome")}<div class="sub">${esc(subline(p))} · ${esc(stageLabel(p))}</div></div>
        <button class="btn sm" data-action="open" data-id="${esc(id)}" data-sched="1">Agendar</button></div>`).join("")}</div>`;
    }
    el.innerHTML = `<div class="agenda">
      <div class="agenda-head"><h2>Agenda</h2>
        <div class="seg" role="group" aria-label="Filtro">
          <button data-action="agenda-tipo" data-v="todas" aria-pressed="${state.agendaTipo === "todas"}">Todos os passos</button>
          <button data-action="agenda-tipo" data-v="contato" aria-pressed="${state.agendaTipo === "contato"}">Só contatos</button>
        </div>
      </div>
      <p class="hint">Cada projeto ativo tem um próximo passo. Abra o projeto para concluir e agendar o seguinte.</p>
      ${body || `<div class="empty"><strong>Nada agendado</strong>Abra um projeto e agende o próximo passo, como “entrar em contato em 7 dias”.</div>`}
    </div>`;
  }

  function renderView() {
    document.querySelectorAll('.tabs [data-action="view"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.view)));
    $("#main").hidden = state.view !== "projetos";
    $("#agenda").hidden = state.view !== "agenda";
    $("#app").classList.toggle("show-detail", state.view === "projetos" && !!state.selectedId && state.projects.has(state.selectedId));
    renderAgenda();
  }

  function renderFilters() {
    document.querySelectorAll('[data-action="f-tipo"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.filter.tipo)));
    const sel = $("#f-status");
    sel.innerHTML = `<option value="ativos">Ativos</option><option value="todos">Todos os status</option>` + STATUS.map((s) => `<option value="${s.v}">${s.l}</option>`).join("");
    sel.value = state.filter.status;
  }

  /* ---------- Report ---------- */
  function report(p) {
    const c = counts(p);
    const L = [];
    L.push(`${(KIND[p.tipo] || {}).l || "Projeto"}: ${p.titulo || "Sem nome"}`.toUpperCase());
    const pr = pendingStages(p);
    L.push(`Etapa: ${stageLabel(p)}${pr.length ? " (pendente: " + pr.map((s) => s.l).join(", ") + ")" : ""} | Status: ${statusLabel(p.status)} | Prioridade: ${(PRIOR.find((x) => x.v === p.prioridade) || PRIOR[1]).l}`);
    L.push("");
    (FIELDS[p.tipo] || []).forEach((f) => { if (p[f.k]) L.push(`${f.l}: ${f.t === "date" ? fmtDate(p[f.k]) : p[f.k]}`); });
    const nt = nextOf(p);
    if (nt) L.push("", `PRÓXIMO PASSO: ${nt.texto} (${fmtDate(nt.prazo)})`);
    if (c.total) {
      L.push("", `Checklist: ${c.ok} OK, ${c.falha} falha, ${c.na} N.A., ${c.pendente} pendente (de ${c.total})`);
      const fails = (p.checklist || []).filter((i) => i.status === "falha");
      if (fails.length) { L.push("", "FALHAS:"); fails.forEach((i) => L.push(`- [${i.grupo}] ${i.texto}${i.nota ? " — " + i.nota : ""}`)); }
      const notes = (p.checklist || []).filter((i) => i.status !== "falha" && i.nota);
      if (notes.length) { L.push("", "OBSERVAÇÕES:"); notes.forEach((i) => L.push(`- ${i.texto}: ${i.nota}`)); }
    }
    const d = (p.diario || []).slice().sort((a, b) => (a.data < b.data ? -1 : 1));
    if (d.length) { L.push("", "HISTÓRICO:"); d.forEach((e) => L.push(`${fmtDate(e.data)} — [${LOG_LABEL[e.tipo || "nota"] || "Nota"}] ${e.texto}`)); }
    return L.join("\n");
  }

  let toastT = null;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function fallbackCopy(txt) {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    toast(ok ? "Relatório copiado." : "Não foi possível copiar automaticamente neste aplicativo.");
  }

  /* ---------- Events ---------- */
  const WRITE_ACTIONS = new Set(["new", "nf-create", "del-ask", "del-yes", "ck-set", "ck-del", "ck-template", "ck-add", "log-add", "log-del", "stage", "sp-advance", "sp-back", "stage-done", "stage-pend", "next-save", "next-drop", "complete-start", "complete-save"]);

  function selectProject(pid, tab) {
    state.selectedId = pid; state.view = "projetos"; state.confirmDelete = false; state.completing = false; state.stagePanel = null;
    state.openNotes.clear(); state.tab = tab || "proximo";
    renderView(); renderList(); renderDetail(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-action]");
    if (!b) return;
    const a = b.dataset.action;
    if (state.readOnly && WRITE_ACTIONS.has(a)) return;

    if (a === "user-menu") { toggleUserMenu(); return; }
    if (a === "um-name") { saveMyName(); return; }
    if (a === "um-pass") { saveMyPassword(); return; }
    if (a === "um-logout") { if (sbClient) sbClient.auth.signOut().finally(() => location.reload()); return; }
    if (a === "view") { state.view = b.dataset.v; renderView(); return; }
    if (a === "agenda-tipo") { state.agendaTipo = b.dataset.v; renderAgenda(); return; }
    if (a === "open") { selectProject(b.dataset.id, "proximo"); return; }

    // Schedule form controls: update the form in place, no re-render
    if (a === "sched-tipo") {
      const pre = b.dataset.prefix; const id = state.selectedId; const p = id && state.projects.get(id); if (!p) return;
      $("#" + pre + "-tipo").value = b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      const tx = $("#" + pre + "-texto");
      if (tx.dataset.auto === "1") tx.value = defaultNextText(p, b.dataset.v);
      if (b.dataset.v === "tarefa") tx.focus();
      return;
    }
    if (a === "sched-days") {
      const pre = b.dataset.prefix;
      $("#" + pre + "-prazo").value = addDays(Number(b.dataset.v));
      $("#" + pre + "-none").value = "0";
      $("#" + pre + "-sched").classList.remove("off");
      b.parentElement.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      return;
    }
    if (a === "sched-none") {
      const pre = b.dataset.prefix;
      const on = $("#" + pre + "-none").value !== "1";
      $("#" + pre + "-none").value = on ? "1" : "0";
      $("#" + pre + "-sched").classList.toggle("off", on);
      b.parentElement.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(on ? x === b : false)));
      return;
    }

    if (a === "new") { state.view = "projetos"; renderView(); $("#newform").hidden = false; $("#app").classList.remove("show-detail"); setTimeout(() => $("#nf-titulo").focus(), 0); return; }
    if (a === "nf-tipo") { state.newTipo = b.dataset.v; document.querySelectorAll('[data-action="nf-tipo"]').forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === state.newTipo))); return; }
    if (a === "nf-cancel") { $("#newform").hidden = true; return; }
    if (a === "nf-create") {
      if (!store) { toast("Ainda conectando ao armazenamento…"); return; }
      const titulo = $("#nf-titulo").value.trim() || (state.newTipo === "homologacao" ? "Nova homologação" : "Nova validação");
      const nid = store.newId();
      const first = JORNADA[state.newTipo][0].k;
      state.projects.set(nid, {
        tipo: state.newTipo, titulo, status: "planejado", prioridade: "media", etapa: first,
        etapasHist: [{ etapa: first, data: todayISO(), autor: state.myId || "" }],
        checklist: makeChecklist(state.newTipo),
        diario: [{ id: rid(), data: todayISO(), tipo: "etapa", texto: "Projeto criado", autor: state.myId || "", auto: true }],
        proximo: null, created: Date.now(), updated: Date.now(), createdBy: state.myId || "",
      });
      saver(nid).isNew = true;
      $("#newform").hidden = true; $("#nf-titulo").value = "";
      if (state.filter.status !== "todos" && state.filter.status !== "ativos") state.filter.status = "ativos";
      if (state.filter.tipo !== "todos" && state.filter.tipo !== state.newTipo) state.filter.tipo = "todos";
      renderFilters();
      state.selectedId = nid; state.tab = "dados"; state.completing = false; state.confirmDelete = false;
      changed(nid, [], { now: true, detail: true });
      return;
    }
    if (a === "f-tipo") { state.filter.tipo = b.dataset.v; renderFilters(); renderList(); return; }
    if (a === "select") { selectProject(b.dataset.id, "proximo"); return; }
    if (a === "back") { state.selectedId = null; renderList(); renderDetail(); return; }

    const id = state.selectedId;
    const p = id && state.projects.get(id);
    if (!p) return;

    if (a === "tab") { state.tab = b.dataset.v; state.completing = false; renderDetail(); return; }
    if (a === "report") {
      const txt = report(p);
      try { navigator.clipboard.writeText(txt).then(() => toast("Relatório copiado. Cole no e-mail ou no Teams."), () => fallbackCopy(txt)); }
      catch (e) { fallbackCopy(txt); }
      return;
    }
    if (a === "del-ask") { state.confirmDelete = true; renderDetail(); return; }
    if (a === "del-no") { state.confirmDelete = false; renderDetail(); return; }
    if (a === "del-yes") {
      const s = saves[id]; if (s) { clearTimeout(s.timer); s.timer = null; s.fields = new Set(); s.isNew = false; }
      state.projects.delete(id); state.selectedId = null; state.confirmDelete = false;
      store.del(id).catch(() => toast("Não foi possível excluir. Tente de novo."));
      renderSummary(); renderList(); renderDetail(); toast("Projeto excluído.");
      return;
    }
    if (a === "stage") {
      if (b.dataset.v === stageKey(p)) { state.stagePanel = null; renderDetail(); return; }
      state.stagePanel = state.stagePanel === b.dataset.v ? null : b.dataset.v; renderDetail(); return;
    }
    if (a === "sp-mark") { b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); return; }
    if (a === "sp-cancel") { state.stagePanel = null; renderDetail(); return; }
    if (a === "sp-advance") {
      const marks = {};
      document.querySelectorAll(".stage-panel .sp-row").forEach((r) => { const on = r.querySelector('[aria-pressed="true"]'); marks[r.dataset.k] = on ? on.dataset.v : "ok"; });
      setStage(id, b.dataset.v, marks);
      return;
    }
    if (a === "sp-back") { setStage(id, b.dataset.v, {}); return; }
    if (a === "stage-done") { setPending(id, b.dataset.v, false); return; }
    if (a === "stage-pend") { setPending(id, b.dataset.v, true); return; }

    if (a === "next-save") {
      const n = readSched("ns"); if (!n) return;
      p.proximo = n;
      changed(id, ["proximo"], { detail: true, now: true });
      toast(`Agendado para ${fmtDate(n.prazo)}.`);
      return;
    }
    if (a === "next-drop") { p.proximo = null; changed(id, ["proximo"], { detail: true, now: true }); return; }
    if (a === "complete-start") { state.completing = true; renderDetail(); const t = $("#cr-text"); if (t) t.focus(); return; }
    if (a === "complete-cancel") { state.completing = false; renderDetail(); return; }
    if (a === "complete-save") {
      const nt = nextOf(p); if (!nt) return;
      const n = readSched("cp"); if (n === false) return;
      const res = ($("#cr-text").value || "").trim();
      const tipo = $("#cr-tipo").value || NEXT_TO_LOG[nt.tipo] || "nota";
      p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo, texto: nt.texto + (res ? "\n" + res : ""), autor: state.myId || "", prazoOriginal: nt.prazo }]);
      p.proximo = n || null;
      state.completing = false;
      changed(id, ["diario", "proximo"], { detail: true, now: true });
      toast(n ? `Registrado. Próximo passo em ${fmtDate(n.prazo)}.` : "Registrado no histórico.");
      return;
    }

    if (a === "ck-set") {
      const it = p.checklist.find((x) => x.id === b.dataset.item); if (!it) return;
      it.status = it.status === b.dataset.v ? "pendente" : b.dataset.v;
      changed(id, ["checklist"], { detail: true });
      if (it.status === "falha" && !it.nota) setTimeout(() => { const n = document.getElementById("nt-" + it.id); n && n.focus(); }, 0);
      return;
    }
    if (a === "ck-note") {
      const iid = b.dataset.item;
      if (state.openNotes.has(iid)) state.openNotes.delete(iid); else state.openNotes.add(iid);
      renderDetail();
      const n = document.getElementById("nt-" + iid); n && n.focus();
      return;
    }
    if (a === "ck-del") { p.checklist = p.checklist.filter((x) => x.id !== b.dataset.item); changed(id, ["checklist"], { detail: true }); return; }
    if (a === "ck-template") { p.checklist = makeChecklist(p.tipo); changed(id, ["checklist"], { detail: true }); return; }
    if (a === "ck-add") { addItem(p, id); return; }
    if (a === "log-add") {
      const texto = $("#log-text").value.trim(); if (!texto) { $("#log-text").focus(); return; }
      const tipo = $("#log-tipo").value || "nota";
      state.logTipo = tipo;
      p.diario = (p.diario || []).concat([{ id: rid(), data: $("#log-date").value || todayISO(), tipo, texto, autor: state.myId || "" }]);
      changed(id, ["diario"], { detail: true, now: true });
      return;
    }
    if (a === "log-del") { p.diario = (p.diario || []).filter((e) => e.id !== b.dataset.entry); changed(id, ["diario"], { detail: true }); return; }
  });

  function addItem(p, id) {
    const txt = $("#ck-new").value.trim(); if (!txt) { $("#ck-new").focus(); return; }
    const grupo = $("#ck-group").value || "Geral";
    p.checklist = (p.checklist || []).concat([{ id: rid(), grupo, texto: txt, status: "pendente", nota: "" }]);
    changed(id, ["checklist"], { detail: true });
    const g = $("#ck-group"); if (g) g.value = grupo;
    const n = $("#ck-new"); if (n) n.focus();
  }

  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "f-q") { state.filter.q = t.value; renderList(); return; }
    if (/-texto$/.test(t.id) && t.dataset.auto) { t.dataset.auto = "0"; return; }
    if (/-prazo$/.test(t.id) && t.dataset.prefix) {
      const pre = t.dataset.prefix;
      document.querySelectorAll(`#${pre}-sched .chip`).forEach((x) => x.setAttribute("aria-pressed", "false"));
      $("#" + pre + "-none").value = "0"; $("#" + pre + "-sched").classList.remove("off");
      return;
    }
    const id = state.selectedId; const p = id && state.projects.get(id);
    if (!p) return;
    if (t.dataset.field && t.tagName !== "SELECT") {
      p[t.dataset.field] = t.type === "number" ? (t.value === "" ? "" : Number(t.value)) : t.value;
      changed(id, [t.dataset.field]);
      return;
    }
    if (t.dataset.note) {
      const it = p.checklist.find((x) => x.id === t.dataset.note); if (!it) return;
      it.nota = t.value; changed(id, ["checklist"]);
    }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "f-status") { state.filter.status = t.value; renderList(); return; }
    const id = state.selectedId; const p = id && state.projects.get(id);
    if (!p) return;
    if (t.tagName === "SELECT" && t.dataset.field) { p[t.dataset.field] = t.value; changed(id, [t.dataset.field], { now: true, detail: !!t.dataset.rerender }); return; }
    if (t.id === "next-date" && p.proximo && t.value) {
      p.proximo = Object.assign({}, p.proximo, { prazo: t.value });
      changed(id, ["proximo"], { now: true, detail: true });
      toast(`Data alterada para ${fmtDate(t.value)}.`);
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    const t = ev.target;
    const id = state.selectedId; const p = id && state.projects.get(id);
    if (t.id === "ck-new") { ev.preventDefault(); if (p) addItem(p, id); }
    if (t.id === "ns-texto") { ev.preventDefault(); const bt = document.querySelector('[data-action="next-save"]'); bt && bt.click(); }
    if (t.id === "nf-titulo") { ev.preventDefault(); document.querySelector('[data-action="nf-create"]').click(); }
    if (t.id === "log-text" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); document.querySelector('[data-action="log-add"]').click(); }
  });
  document.addEventListener("focusout", () => {
    const id = state.selectedId;
    if (id && saves[id] && saves[id].timer !== null) flush(id);
  });

  /* ---------- Boot ---------- */
  renderFilters(); renderSummary(); renderList(); renderDetail(); renderView();

  function useLocal(msg) {
    store = localStore();
    const bn = $("#banner"); bn.textContent = msg; bn.hidden = false;
    store.subscribe(onSnapshot);
  }
  /* ---------- Own site: Supabase database + e-mail/password login ---------- */
  let sbClient = null;
  let myName = "";
  const isUuid = (v) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v || "");

  function supaStore(sb, uid) {
    let cb = null, timer = null;
    const mapErr = (e) => ({ code: e && e.code === "42501" ? "invalid_argument" : "unavailable", message: (e && e.message) || "" });
    async function fetchAll() {
      const { data, error } = await sb.from("projects").select("id,data");
      if (error) { toast("Não foi possível carregar os projetos. Verifique a conexão."); return; }
      cb && cb((data || []).map((r) => ({ id: r.id, data: r.data || {} })));
    }
    const refresh = () => { clearTimeout(timer); timer = setTimeout(fetchAll, 250); };
    return {
      subscribe(f) {
        cb = f; fetchAll();
        sb.channel("projects-changes").on("postgres_changes", { event: "*", schema: "public", table: "projects" }, refresh).subscribe();
        document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
        setInterval(refresh, 60000);
        return () => {};
      },
      async set(id, data) { const { error } = await sb.from("projects").upsert({ id, data, updated_by: uid, updated_at: new Date().toISOString() }); if (error) throw mapErr(error); },
      async update(id, patch) {
        const { data, error } = await sb.rpc("merge_project", { p_id: id, p_patch: patch });
        if (error) throw mapErr(error);
        if (data === false) throw { code: "not_found" };
      },
      async del(id) { const { error } = await sb.from("projects").delete().eq("id", id); if (error) throw mapErr(error); },
      newId() { return (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 20) : rid()); },
    };
  }
  function supaUserApi(sb, uid) {
    const cache = {};
    return {
      id: async () => uid,
      can: async () => true,
      async profiles(ids) {
        const want = Array.from(new Set(ids)).filter((x) => isUuid(x) && !(x in cache));
        if (want.length) {
          const { data } = await sb.from("profiles").select("id,nome").in("id", want);
          (data || []).forEach((r) => { cache[r.id] = r.nome || ""; });
          want.forEach((x) => { if (!(x in cache)) cache[x] = ""; });
        }
        const out = {};
        ids.forEach((x) => { out[x] = { id: x, name: cache[x] || "", isMe: x === uid }; });
        return out;
      },
    };
  }

  function renderLogin(msg) {
    $("#app").hidden = true;
    const a = $("#auth"); a.hidden = false;
    a.innerHTML = `<form class="auth-card" id="login-form" novalidate>
      <h1>Validações de Campo</h1>
      <p>Entre com o e-mail e a senha que o responsável cadastrou para você.</p>
      <label for="lg-email">E-mail<input class="field-in" id="lg-email" type="email" autocomplete="username" required></label>
      <label for="lg-pass">Senha<input class="field-in" id="lg-pass" type="password" autocomplete="current-password" required></label>
      <div class="err" id="lg-err">${esc(msg || "")}</div>
      <button class="btn primary" type="submit" id="lg-btn">Entrar</button>
      <p>Esqueceu a senha? Fale com o responsável pelo app.</p>
    </form>`;
    setTimeout(() => { const e = $("#lg-email"); e && e.focus(); }, 0);
  }
  document.addEventListener("submit", async (ev) => {
    if (ev.target.id !== "login-form") return;
    ev.preventDefault();
    const email = $("#lg-email").value.trim(), password = $("#lg-pass").value;
    if (!email || !password) { $("#lg-err").textContent = "Preencha e-mail e senha."; return; }
    $("#lg-btn").disabled = true; $("#lg-err").textContent = "";
    const { error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) { $("#lg-btn").disabled = false; $("#lg-err").textContent = /invalid/i.test(error.message) ? "E-mail ou senha incorretos." : "Não foi possível entrar. Verifique a conexão e tente de novo."; return; }
    location.reload();
  });

  function toggleUserMenu() {
    const m = $("#usermenu");
    if (!m.hidden) { m.hidden = true; return; }
    m.innerHTML = `<label for="um-nome">Seu nome (aparece nos registros)<input class="field-in" id="um-nome" value="${esc(myName)}"></label>
      <button class="btn" data-action="um-name">Salvar nome</button>
      <label for="um-senha">Nova senha (mínimo 8 caracteres)<input class="field-in" id="um-senha" type="password" autocomplete="new-password"></label>
      <button class="btn" data-action="um-pass">Trocar senha</button>
      <button class="btn ghost danger" data-action="um-logout">Sair</button>`;
    m.hidden = false;
  }
  async function saveMyName() {
    const nome = ($("#um-nome").value || "").trim(); if (!nome) return;
    const { error } = await sbClient.from("profiles").update({ nome }).eq("id", state.myId);
    if (error) { toast("Não foi possível salvar o nome."); return; }
    myName = nome; $("#userchip").textContent = nome + " ▾"; toast("Nome salvo."); renderDetail();
  }
  async function saveMyPassword() {
    const pw = $("#um-senha").value || "";
    if (pw.length < 8) { toast("A senha precisa ter pelo menos 8 caracteres."); return; }
    const { error } = await sbClient.auth.updateUser({ password: pw });
    if (error) { toast("Não foi possível trocar a senha."); return; }
    $("#um-senha").value = ""; toast("Senha alterada.");
  }

  async function bootSupabase(cfg) {
    if (!window.supabase || !window.supabase.createClient) {
      renderLogin("Não foi possível carregar o app. Verifique a internet e recarregue a página.");
      $("#lg-btn").disabled = true;
      return;
    }
    sbClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    const { data } = await sbClient.auth.getSession();
    const session = data && data.session;
    if (!session) { renderLogin(); return; }
    const uid = session.user.id;
    state.myId = uid; state.canWrite = true;
    userApi = supaUserApi(sbClient, uid);
    const { data: prof } = await sbClient.from("profiles").select("nome").eq("id", uid).maybeSingle();
    myName = (prof && prof.nome) || (session.user.email || "").split("@")[0];
    const chip = $("#userchip"); chip.textContent = myName + " ▾"; chip.hidden = false;
    sbClient.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") location.reload(); });
    store = supaStore(sbClient, uid);
    store.subscribe(onSnapshot);
  }

  (async function boot() {
    const cfg = window.APP_CONFIG;
    if (!(window.claude && window.claude.use) && cfg && cfg.supabaseUrl && cfg.supabaseKey) { bootSupabase(cfg); return; }
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { useLocal("Modo local: os dados ficam salvos só neste navegador. Abra o app pelo claude.ai com sua conta para salvar na nuvem."); return; }
    try { userApi = await window.claude.use("user"); } catch (e) { userApi = null; }
    if (userApi) {
      try { state.myId = await userApi.id(); } catch (e) { state.myId = null; }
      try { state.canWrite = await userApi.can("data.write"); } catch (e) { state.canWrite = null; }
      if (state.canWrite === false) setReadOnly(true);
    }
    store = dbStore(db);
    store.subscribe(onSnapshot, (err) => {
      if (err && err.code === "revoked") { toast("Acesso aos dados foi encerrado."); return; }
      toast("Conexão com os dados perdida. Recarregue a página.");
    });
  })();
})();
</script>

</body>
</html>
