<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<title>Validações de Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: field-terminal console — summary strip on top, project list left, project sheet right (journey, then tabs: next step / history / checklist / data); agenda lists each project's single next step; stacks on phones */
:root {
  --bg: #edf0ea;
  --surface: #f9fbf7;
  --raised: #ffffff;
  --ink: #18231d;
  --muted: #5b685f;
  --line: #d2d9d0;
  --accent: #1e6a4e;
  --accent-soft: #dcebe2;
  --accent-ink: #ffffff;
  --ok: #2b7a4b;
  --ok-soft: #dcefe2;
  --fail: #b8382a;
  --fail-soft: #f6e0dc;
  --pend: #9a6c05;
  --pend-soft: #f4ead2;
  --na: #6f7a74;
  --na-soft: #e6e9e6;
  --info: #2f5f8f;
  --info-soft: #dfe8f2;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #151d19; --raised: #1b2520; --ink: #e2eae4; --muted: #94a39a;
    --line: #2a3630; --accent: #5cbf8e; --accent-soft: #1d3329; --accent-ink: #0b1510;
    --ok: #5cbf8e; --ok-soft: #1c3428; --fail: #ee7465; --fail-soft: #3a201c;
    --pend: #e2b44a; --pend-soft: #362c14; --na: #8c9892; --na-soft: #242c28;
    --info: #7fb0e0; --info-soft: #1c2a38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151d19; --raised: #1b2520; --ink: #e2eae4; --muted: #94a39a;
  --line: #2a3630; --accent: #5cbf8e; --accent-soft: #1d3329; --accent-ink: #0b1510;
  --ok: #5cbf8e; --ok-soft: #1c3428; --fail: #ee7465; --fail-soft: #3a201c;
  --pend: #e2b44a; --pend-soft: #362c14; --na: #8c9892; --na-soft: #242c28;
  --info: #7fb0e0; --info-soft: #1c2a38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app {
  display: flex; flex-direction: column; gap: 14px; max-width: 1360px; margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { min-width: 230px; }
.tabs button { font-weight: 600; padding: 7px 12px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--fail); color: var(--raised); font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--fail); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.banner { border: 1px solid var(--pend); background: var(--pend-soft); color: var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 13px; }

/* Summary strip */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.stat { padding: 10px 14px; border: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; background: transparent; text-align: left; }
button.stat:hover { background: var(--raised); }
.stat:first-child { border-left: 0; }
.stat .n { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.stat.warn .n { color: var(--pend); }
.stat.bad .n { color: var(--fail); }
.stat.info .n { color: var(--info); }

/* Main split */
.main { display: block; }
.app.show-detail #home, .app.show-detail .strip { display: none; }
.app:not(.show-detail) .detail-panel { display: none; }
.detail-panel { max-width: 1180px; margin: 0 auto; }

/* Home: toolbar, cards, board */
.home { display: flex; flex-direction: column; gap: 14px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .seg { flex: 0 0 auto; }
.toolbar #f-status { flex: 1 1 160px; max-width: 220px; width: auto; }
.toolbar #f-q { flex: 1 1 220px; width: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; overflow: hidden; min-width: 0; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); border-color: var(--muted); box-shadow: 0 8px 20px -14px var(--ink); }
.cover { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: repeating-linear-gradient(104deg, var(--accent-soft) 0 12px, var(--surface) 12px 24px); display: flex; align-items: flex-end; overflow: hidden; }
.cover img, .d-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .ph { position: relative; padding: 10px 12px; font-family: var(--f-display); font-weight: 700; font-size: 22px; text-transform: uppercase; color: var(--accent); line-height: 1; letter-spacing: .02em; overflow-wrap: anywhere; }
.cover .badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.card .sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbar { display: flex; gap: 3px; margin-top: 4px; }
.sbar i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.sbar i.on { background: var(--accent); }
.sbar i.cur { background: var(--accent); outline: 2px solid var(--accent-soft); }
.sbar i.pend { background: var(--pend); }
.sl { font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.sl b { font-weight: 600; }
.sl .n { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; }
.card .nx { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .nx b { color: var(--ink); font-weight: 500; }
.board-group { display: flex; flex-direction: column; gap: 8px; }
.board-group h2 { font-family: var(--f-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 120px; min-width: 0; }
.col-h { padding: 8px 10px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; }
.col-h .ct { font-family: var(--f-mono); }
.col.has .col-h { color: var(--ink); }
.col-b { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.mcard { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 6px; width: 100%; }
.mcard:hover { border-color: var(--accent); }
.mcard .th { width: 44px; height: 44px; border-radius: 4px; overflow: hidden; background: repeating-linear-gradient(104deg, var(--accent-soft) 0 6px, var(--surface) 6px 12px); position: relative; }
.mcard .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mcard b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard span { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 0; }
.d-cover { position: relative; aspect-ratio: 4 / 1; max-height: 240px; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden; background: repeating-linear-gradient(104deg, var(--accent-soft) 0 14px, var(--surface) 14px 28px); border: 1px solid var(--line); }
.d-cover.none { aspect-ratio: auto; min-height: 56px; }
.d-cover .cv-actions { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.d-cover.none .cv-actions { position: static; padding: 12px; justify-content: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }

/* List */
.list-head { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; min-width: 0; }
.field-in, select.field-in { width: 100%; border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 6px 9px; }
.field-in:focus { border-color: var(--accent); outline: none; }
.items { display: flex; flex-direction: column; max-height: calc(100vh - 260px); min-height: 200px; overflow-y: auto; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 11px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.item:hover { background: var(--raised); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .tt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub, .item .nx { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .nx b { font-weight: 500; color: var(--ink); }
.item .meta { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.kind { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .04em; border-radius: 4px; padding: 2px 5px; align-self: start; margin-top: 2px; }
.kind.hom { background: var(--info-soft); color: var(--info); }
.kind.val { background: var(--pend-soft); color: var(--pend); }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; align-self: start; }
.st-planejado { background: var(--na-soft); color: var(--na); }
.st-agendado { background: var(--info-soft); color: var(--info); }
.st-andamento { background: var(--accent-soft); color: var(--accent); }
.st-aguardando { background: var(--pend-soft); color: var(--pend); }
.st-aprovado { background: var(--ok-soft); color: var(--ok); }
.st-reprovado { background: var(--fail-soft); color: var(--fail); }
.st-cancelado { background: var(--na-soft); color: var(--na); text-decoration: line-through; }
.tag-ex { font-size: 10.5px; border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 0 4px; }
.stage-mini { display: inline-flex; gap: 2px; }
.stage-mini i { width: 9px; height: 4px; border-radius: 1px; background: var(--line); display: block; }
.stage-mini i.on { background: var(--accent); }
.stage-mini i.pend { background: var(--pend); }
.late { color: var(--fail); font-weight: 600; }
.today { color: var(--pend); font-weight: 600; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--ink); font-size: 15px; }

/* New project form */
.newform { padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--raised); max-width: 560px; }
.newform label { font-size: 12px; color: var(--muted); }

/* Detail */
.detail { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 24px; }
.d-head { display: flex; flex-direction: column; gap: 10px; }
.d-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.d-top .spacer { flex: 1; }
.back { display: inline-flex; }
fieldset.fs { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
fieldset.d-head2 { display: flex; flex-direction: column; gap: 8px; }
.title-in { font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.1; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; width: 100%; }
.title-in:hover { border-color: var(--line); }
.title-in:focus { border-color: var(--accent); outline: none; background: var(--raised); }
.d-sub { color: var(--muted); font-size: 13.5px; }
.d-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.d-ctrl label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.d-ctrl select { min-width: 170px; }
.who { font-size: 12px; color: var(--muted); }
.confirm { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--fail-soft); padding: 6px 10px; border-radius: 6px; flex-wrap: wrap; }

.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 17px; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.sec-h .aside { color: var(--muted); font-size: 12.5px; flex: 1; }

/* Journey stepper */
.journey { overflow-x: auto; padding: 4px 2px 6px; }
.steps { display: flex; min-width: max-content; list-style: none; margin: 0; padding: 0; }
.step { flex: 1 0 96px; }
.step button { width: 100%; border: 0; background: transparent; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 0 8px 0 0; text-align: left; color: var(--muted); font-size: 12.5px; line-height: 1.25; }
.step .node { width: 100%; display: flex; align-items: center; }
.step .dotn { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); flex: none; }
.step .ln { height: 2px; background: var(--line); flex: 1; margin-left: 4px; }
.step:last-child .ln { visibility: hidden; }
.step.done .dotn { background: var(--accent); border-color: var(--accent); }
.step.done .ln { background: var(--accent); }
.step.cur .dotn { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.cur button { color: var(--ink); font-weight: 600; }
.step.done button { color: var(--ink); }
.step button:hover .dotn { border-color: var(--accent); }
.step .sd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.step.pend .dotn { background: var(--pend-soft); border-color: var(--pend); border-style: dashed; }
.step.pend .ln { background: var(--accent); }
.step.pend button { color: var(--ink); }
.step .pl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--pend); }
.stage-panel { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.stage-panel .sp-q { font-size: 13.5px; }
.sp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 0; border-top: 1px dashed var(--line); }
.sp-row .seg { flex: 0 0 auto; }
.sp-row .seg button[data-v="pend"][aria-pressed="true"] { background: var(--pend-soft); color: var(--pend); }
.pend-list { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; background: var(--pend-soft); border-radius: 6px; padding: 6px 10px; }
.pend-list b { color: var(--pend); }
.since { font-size: 12.5px; color: var(--muted); }
.suggest { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--info-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px; }

/* Detail tabs */
.dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: -12px; }
.dtabs button { border: 0; background: transparent; padding: 8px 12px 9px; font-family: var(--f-display); font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.dtabs button:hover { color: var(--ink); }
.dtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.dtabs .cnt { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0; background: var(--na-soft); color: var(--muted); border-radius: 9px; padding: 0 6px; line-height: 17px; }
.dtabs .cnt.late { background: var(--fail); color: var(--raised); }
.dtabs .cnt.today { background: var(--pend); color: var(--raised); }
.dtabs .cnt.warn { background: var(--pend-soft); color: var(--pend); }

/* Next step */
.next-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 18px; border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--raised); border-radius: 8px; padding: 16px; }
.next-card.late { border-left-color: var(--fail); }
.next-card.today { border-left-color: var(--pend); }
.nc-when { display: flex; flex-direction: column; min-width: 92px; }
.nc-when .big { font-family: var(--f-display); font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.nc-when .rel { font-size: 12.5px; color: var(--muted); }
.next-card.late .big, .next-card.late .rel { color: var(--fail); }
.next-card.today .big, .next-card.today .rel { color: var(--pend); }
.nc-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.nc-body strong { font-size: 16px; overflow-wrap: anywhere; }
.nc-meta { font-size: 12.5px; color: var(--muted); }
.nc-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; }
.nc-actions label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.nc-actions input[type="date"] { width: auto; }
.box { border: 1px solid var(--line); border-radius: 8px; background: var(--raised); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.box h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.box .row-end { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

    if (!els.length || !store || !store.fileUrls) return;
    const refs = Array.from(new Set(els.map((e) => e.dataset.file || e.dataset.fileImg).filter((r) => r && !coverCache[r])));
    if (refs.length) { try { Object.assign(coverCache, await store.fileUrls(refs)); } catch (e) { return; } }
    els.forEach((e) => {
      if (e.dataset.file) { const u = coverCache[e.dataset.file]; if (u) { e.href = u; e.removeAttribute("data-file"); } }
      if (e.dataset.fileImg) { const u = coverCache[e.dataset.fileImg]; if (u) { e.src = u; e.removeAttribute("data-file-img"); } }
    });
  }
  async function inlineFile(id, file) {
    // claude.ai / local mode: only photos, reduced and kept inside the project
    if (!isImgType(file.type)) throw { code: "not_supported" };
    let blob = await resizeImage(file, 900, 0.62);
    if (blob.size > 120000) blob = await resizeImage(file, 640, 0.55);
    return { ref: await blobToDataUrl(blob), nome: file.name || "foto.jpg", tipo: "image/jpeg", tamanho: blob.size, img: true };
  }
  // pending files of the open dialog: [{key, file, url}] new, [{key, meta}] already saved
  function attSection(num) {
    return `<div class="q"><span class="qn">${num}</span>Fotos e arquivos <span class="opt">(opcional)</span></div>
      <div class="att-pick">
        <input type="file" id="att-input" multiple hidden>
        <button type="button" class="btn" data-action="att-pick">+ Adicionar fotos ou arquivos</button>
        <span class="hint">${store && store.inlineOnly ? "Neste modo só é possível anexar fotos." : "Fotos, PDF, planilhas, logs… até 25 MB cada."}</span>
      </div>
      <div class="att-pending" id="att-list">${attPendingHtml()}</div>`;
  }
  function attPendingHtml() {
    return (state.att || []).map((a) => {
      const name = a.file ? a.file.name : a.meta.nome;
      const size = a.file ? a.file.size : a.meta.tamanho;
      const img = a.file ? isImgType(a.file.type) : a.meta.img;
      const thumb = img ? (a.url ? `<img src="${esc(a.url)}" alt="">` : (fileSrc(a.meta.ref) ? `<img src="${esc(fileSrc(a.meta.ref))}" alt="">` : `<span class="ext">FOTO</span>`)) : `<span class="ext">${esc(extOf(name))}</span>`;
      return `<div class="att-row">${thumb}<span class="nm">${esc(name)}</span><span class="sz">${esc(fmtSize(size || 0))}</span><button type="button" class="icon-btn" data-action="att-remove" data-k="${a.key}" aria-label="Remover anexo">×</button></div>`;
    }).join("");
  }
  function renderAttList() { const l = $("#att-list"); if (l) l.innerHTML = attPendingHtml(); }
  function clearAtt() { (state.att || []).forEach((a) => { if (a.url) URL.revokeObjectURL(a.url); }); state.att = []; state.attRemoved = []; }
  function addAttFiles(files) {
    Array.from(files || []).forEach((f) => {
      if (f.size > MAX_FILE) { toast(`“${f.name}” passa de 25 MB.`); return; }
      if (store && store.inlineOnly && !isImgType(f.type)) { toast("Neste modo só é possível anexar fotos. No site próprio dá para anexar qualquer arquivo."); return; }
      state.att.push({ key: rid(), file: f, url: isImgType(f.type) ? URL.createObjectURL(f) : "" });
    });
    renderAttList();
  }
  async function uploadPending(id, btn) {
    const out = [];
    const news = state.att.filter((a) => a.file);
    let i = 0;
    for (const a of state.att) {
      if (a.meta) { out.push(a.meta); continue; }
      i++;
      if (btn) btn.textContent = `Enviando ${i} de ${news.length}…`;
      out.push(await store.uploadFile(id, a.file));
    }
    return out;
  }
  function removeFiles(list) { const refs = (list || []).map((f) => f.ref).filter(Boolean); if (refs.length && store && store.removeFiles) store.removeFiles(refs).catch(() => {}); }

  /* ---------- State ---------- */
  const state = {
    projects: new Map(),
    loaded: false,
    selectedId: null,
    view: "projetos",
    tab: "historico",
    agendaTipo: "todas",
    filter: { tipo: "todos", status: "ativos", q: "" },
    newTipo: "homologacao",
    confirmDelete: false,
    stagePanel: null,
    reg: null,
    openMachine: null,
    mDelAsk: null,
    att: [],
    saving: false,
    attRemoved: [],
    nextModal: null,
    jrOpen: null,
    homeView: (function () { try { return localStorage.getItem("vc-home-view") || "cards"; } catch (e) { return "cards"; } })(),
    openNotes: new Set(),
    logTipo: "visita",
    readOnly: false,
    canWrite: null,
    myId: null,
  };
  let store = null;
  let userApi = null;

  function setReadOnly(on) {
    state.readOnly = on;
    $("#app").classList.toggle("ro", on);
    const bn = $("#banner");
    if (on) {
      bn.textContent = "Acesso somente leitura: você pode ver os projetos, mas não editar. Peça ao responsável pelo app para te convidar como Editor.";

      $("#newform").hidden = true;

    renderDetail(); renderAgenda();

  async function hydrateNames() {
    if (!userApi) return;
    const els = Array.from(document.querySelectorAll("[data-uid]"));
    const ids = Array.from(new Set(els.map((e) => e.dataset.uid).filter(Boolean)));
    if (!ids.length) return;
    let ps = {};
    try { ps = await userApi.profiles(ids); } catch (e) { return; }
    els.forEach((e) => { const pr = ps[e.dataset.uid]; if (pr) e.textContent = pr.isMe ? "você" : (pr.name || "outra pessoa"); });
  }

  /* ---------- Storage adapters ---------- */
  function dbStore(db) {
    const col = db.collection("projects");
    return {
      subscribe(cb, onErr) { return col.onSnapshot((snap) => cb(snap.docs.map((d) => ({ id: d.id, data: d.data() }))), onErr); },
      set(id, data) { return col.doc(id).set(data); },
      update(id, patch) { return col.doc(id).update(patch); },
      del(id) { return col.doc(id).delete(); },
      newId() { return col.doc().id; },
      uploadCover: inlineCover,
      async removeCover() {},
      inlineOnly: true,
      uploadFile: inlineFile,
      async removeFiles() {},
    };
  }
  function localStore() {
    const KEY = "validacoes-campo-local";
    let cb = null;
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
    const write = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
    const emit = () => { const o = read(); cb && cb(Object.keys(o).map((id) => ({ id, data: o[id] }))); };
    return {
      subscribe(f) { cb = f; setTimeout(emit, 0); return () => { cb = null; }; },
      set(id, data) { const o = read(); o[id] = data; write(o); return Promise.resolve(); },
      update(id, patch) { const o = read(); o[id] = Object.assign(o[id] || {}, patch); write(o); return Promise.resolve(); },
      del(id) { const o = read(); delete o[id]; write(o); return Promise.resolve(); },
      newId() { return rid(); },
      uploadCover: inlineCover,
      async removeCover() {},
      inlineOnly: true,
      uploadFile: inlineFile,
      async removeFiles() {},
    };
  }

  /* ---------- Saving: debounced, one write at a time per project, only changed fields ---------- */
  const saves = {};
  function saver(id) { return saves[id] || (saves[id] = { timer: null, chain: Promise.resolve(), inflight: 0, fields: new Set(), isNew: false }); }
  function busy(id) { const s = saves[id]; return !!s && (s.timer !== null || s.inflight > 0); }
  function updateSaving() { $("#saving").textContent = Object.keys(saves).some(busy) ? "Salvando…" : ""; }
  function scheduleSave(id, delay) {
    const s = saver(id);
    clearTimeout(s.timer);
    s.timer = setTimeout(() => flush(id), delay == null ? 700 : delay);
    updateSaving();
  }
  function flush(id) {
    const s = saver(id);
    clearTimeout(s.timer); s.timer = null;
    const p = state.projects.get(id);
    if (!p || !store || (!s.isNew && !s.fields.size)) { updateSaving(); return; }
    p.updated = Date.now();
    if (state.myId) p.updatedBy = state.myId;
    let op;
    if (s.isNew) {
      const body = clone(p);
      op = () => store.set(id, body);
    } else {
      const patch = { updated: p.updated };
      if (state.myId) patch.updatedBy = state.myId;
      s.fields.forEach((k) => { patch[k] = p[k] === null ? null : clone(p[k]); });
      op = () => store.update(id, patch);
    }
    s.isNew = false; s.fields = new Set();
    s.inflight++;
    s.chain = s.chain
      .then(op)
      .catch((e) => {
        const code = e && e.code;
        if (code === "not_found" || (code === "invalid_argument" && state.canWrite === true)) toast("Este projeto foi excluído por outra pessoa.");
        else if (code === "invalid_argument") { setReadOnly(true); toast("Você não tem permissão para editar."); }
        else toast(code === "quota_exceeded" ? "Armazenamento cheio: apague projetos antigos." : "Não foi possível salvar. Verifique a conexão e tente de novo.");
      })
      .finally(() => { s.inflight--; updateSaving(); });
    updateSaving();
  }
  function changed(id, fields, opts) {
    if (state.readOnly) return;
    const s = saver(id);
    (fields || []).forEach((f) => s.fields.add(f));
    scheduleSave(id, opts && opts.now ? 0 : 700);
    renderSummary(); renderList();
    if (state.view === "agenda") renderAgenda();
    if (opts && opts.detail) renderDetail();
  }

  function onSnapshot(rows) {
    const seen = new Set();
    rows.forEach(({ id, data }) => {
      seen.add(id);
      if (!busy(id)) state.projects.set(id, Object.assign({ checklist: [], diario: [], etapasHist: [], etapasPend: [], proximo: null }, clone(data)));
    });
    for (const id of Array.from(state.projects.keys())) if (!seen.has(id) && !busy(id)) state.projects.delete(id);
    state.loaded = true;
    if (state.selectedId && !state.projects.has(state.selectedId)) state.selectedId = null;
    renderSummary(); renderList();
    if (!$("#detail").contains(document.activeElement)) renderDetail();
    if (state.view === "agenda" && !$("#agenda").contains(document.activeElement)) renderAgenda();
  }

  /* ---------- Automation: activities move the journey and machine status forward ---------- */
  // activity type -> journey stage it completes (the journey moves to the stage after it)
  const AUTO_DONE = {
    homologacao: { instalacao: "instalacao", treinamento: "entrega" },
  };
  // activity type -> journey stage it puts in progress (only ever moves forward)
  const AUTO_STAGE = {
    homologacao: { teste: "testes" },
    validacao: { teste: "bancada" },
  };
  // activity type -> machine status change, for the machines marked in the activity
  const AUTO_MACH = {
    instalacao: { from: ["aguardando"], to: "instalada" },
    treinamento: { from: ["aguardando", "instalada", "homologada"], to: "entregue" },
  };
  function advanceTo(p, k) {
    const st = stages(p); const ti = st.findIndex((x) => x.k === k);
    if (ti < 0 || ti <= stageIdx(p)) return null;
    p.etapa = k;
    p.etapasHist = (p.etapasHist || []).concat([{ etapa: k, data: todayISO(), autor: state.myId || "", auto: true }]);
    p.etapasPend = (p.etapasPend || []).filter((x) => x !== k);
    p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo: "etapa", texto: "Etapa: " + st[ti].l, autor: state.myId || "", auto: true }]);
    return st[ti].l;
  }
  // act: { tipo: activity type or null, maquinas: [ids], next: new next step or null }
  function applyAutomation(p, act) {
    const msgs = []; const fields = new Set();
    // freeze machine statuses before the journey moves (older projects derive them from the stage)
    if ((act.maquinas || []).length) ensureMachines(p);
    let lbl = null;
    const doneK = act.tipo && (AUTO_DONE[p.tipo] || {})[act.tipo];
    if (doneK) {
      const st = stages(p); const di = st.findIndex((x) => x.k === doneK);
      if (di >= 0 && di + 1 < st.length && advanceTo(p, st[di + 1].k)) { lbl = st[di].l; msgs.push(`etapa “${st[di].l}” concluída`); }
    }
    const target = !lbl && act.tipo && (AUTO_STAGE[p.tipo] || {})[act.tipo];
    if (target) { lbl = advanceTo(p, target); if (lbl) msgs.push(`jornada em “${lbl}”`); }
    if (!lbl && p.tipo === "homologacao" && (act.tipo === "visita" || act.tipo === "suporte") && stageKey(p) === "entrega") { lbl = advanceTo(p, "acomp_campo"); if (lbl) msgs.push(`jornada em “${lbl}”`); }
    if (!lbl && p.tipo === "homologacao" && act.next && act.next.tipo === "visita" && stageKey(p) === "contato") { lbl = advanceTo(p, "agendado"); if (lbl) msgs.push(`jornada em “${lbl}”`); }
    if (lbl) ["etapa", "etapasHist", "etapasPend", "diario"].forEach((f) => fields.add(f));
    const rule = p.tipo === "homologacao" && act.tipo ? AUTO_MACH[act.tipo] : null;
    if (rule && (act.maquinas || []).length) {
      ensureMachines(p).forEach((m, i) => {
        if (!act.maquinas.includes(m.id) || !rule.from.includes(m.situacao || "aguardando")) return;
        m.situacao = rule.to;
        p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo: "maquina", texto: `${machineLabel(p, m, i)}: ${sitLabel(p, rule.to)}`, autor: state.myId || "", auto: true, maquinas: [m.id] }]);
        msgs.push(`${machineLabel(p, m, i)} ${sitLabel(p, rule.to).toLowerCase()}`);
        fields.add("maquinas"); fields.add("diario");
      });
    }
    return { msgs, fields: Array.from(fields) };
  }

  /* ---------- Domain actions ---------- */
  // marks: { stageKey: "ok" | "pend" } for the stages passed over when moving ahead
  // Going back to the stage right before the last change undoes that change (no extra history line)
  function undoLastStage(id, k) {
    const p = state.projects.get(id); if (!p) return false;
    const hist = p.etapasHist || [];
    const cur = stageKey(p);
    if (!hist.length || hist[hist.length - 1].etapa !== cur) return false;
    const prev = hist.length > 1 ? hist[hist.length - 2].etapa : stages(p)[0].k;
    if (prev !== k) return false;
    const curLabel = (stages(p).find((s) => s.k === cur) || {}).l || "";
    const d = (p.diario || []).slice();
    for (let i = d.length - 1; i >= 0; i--) {
      if (d[i].auto && d[i].tipo === "etapa" && (d[i].texto || "").indexOf("Etapa: " + curLabel) === 0) { d.splice(i, 1); break; }
    }
    p.diario = d;
    p.etapasHist = hist.slice(0, -1);
    p.etapa = k;
    p.etapasPend = (p.etapasPend || []).filter((x) => x !== k);
    state.stagePanel = null;
    changed(id, ["etapa", "etapasPend", "etapasHist", "diario"], { detail: true, now: true });
    toast("Mudança de etapa desfeita.");
    return true;
  }
  function setStage(id, k, marks) {
    const p = state.projects.get(id); if (!p || stageKey(p) === k) return;
    const st = stages(p).find((s) => s.k === k); if (!st) return;
    const pend = new Set(p.etapasPend || []);
    const novasPend = [];
    Object.keys(marks || {}).forEach((sk) => {
      if (marks[sk] === "pend") { if (!pend.has(sk)) novasPend.push(sk); pend.add(sk); } else pend.delete(sk);
    });
    pend.delete(k);
    p.etapa = k;
    p.etapasPend = Array.from(pend);
    p.etapasHist = (p.etapasHist || []).concat([{ etapa: k, data: todayISO(), autor: state.myId || "" }]);
    const nomes = novasPend.map((sk) => (stages(p).find((s) => s.k === sk) || {}).l).filter(Boolean);
    p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo: "etapa", texto: "Etapa: " + st.l + (nomes.length ? " (pendente: " + nomes.join(", ") + ")" : ""), autor: state.myId || "", auto: true }]);
    state.stagePanel = null;
    changed(id, ["etapa", "etapasPend", "etapasHist", "diario"], { detail: true, now: true });
  }
  function setPending(id, k, on) {
    const p = state.projects.get(id); if (!p) return;
    const st = stages(p).find((s) => s.k === k); if (!st) return;
    const pend = new Set(p.etapasPend || []);
    if (on) pend.add(k); else pend.delete(k);
    p.etapasPend = Array.from(pend);
    p.diario = (p.diario || []).concat([{ id: rid(), data: todayISO(), tipo: "etapa", texto: (on ? "Etapa pendente: " : "Etapa concluída: ") + st.l, autor: state.myId || "", auto: true }]);
    state.stagePanel = null;
    changed(id, ["etapasPend", "diario"], { detail: true, now: true });
  }
  function pendingStages(p) {
    const ci = stageIdx(p); const pend = new Set(p.etapasPend || []);
    return stages(p).filter((s, i) => i < ci && pend.has(s.k));
  }
  function readSched(prefix) {
    const keepEl = $("#" + prefix + "-keep");
    if (keepEl && keepEl.value === "1") return "keep";
    const none = $("#" + prefix + "-none");
    if (none && none.value === "1") return null;
    const texto = ($("#" + prefix + "-texto").value || "").trim();
    const tipo = $("#" + prefix + "-tipo").value || "contato";
    const prazo = $("#" + prefix + "-prazo").value || "";
    if (!texto) { $("#" + prefix + "-texto").focus(); toast("Escreva o que precisa ser feito."); return false; }
    if (!prazo) { $("#" + prefix + "-prazo").focus(); toast("Escolha quando."); return false; }
    return { id: rid(), texto, tipo, prazo, criado: todayISO(), autor: state.myId || "" };
  }

  /* ---------- Rendering ---------- */
  function activeProjects() { return Array.from(state.projects.entries()).filter(([, p]) => !CLOSED.has(p.status) && stageKey(p) !== "encerrado"); }

  function renderSummary() {
    const act = activeProjects();
    const nexts = act.map(([, p]) => nextOf(p)).filter(Boolean);
    const late = nexts.filter((n) => { const d = daysFrom(n.prazo); return d !== null && d < 0; }).length;
    const today = nexts.filter((n) => daysFrom(n.prazo) === 0).length;
    const week = nexts.filter((n) => { const d = daysFrom(n.prazo); return d !== null && d > 0 && d <= 7; }).length;
    const sem = act.filter(([, p]) => !nextOf(p)).length;
    $("#strip").innerHTML = [
      `<button class="stat" data-action="view" data-v="projetos"><span class="n">${act.length}</span><span class="l">Projetos ativos</span></button>`,
      `<button class="stat ${late ? "bad" : ""}" data-action="view" data-v="agenda"><span class="n">${late}</span><span class="l">Atrasados</span></button>`,
      `<button class="stat ${today ? "warn" : ""}" data-action="view" data-v="agenda"><span class="n">${today}</span><span class="l">Para hoje</span></button>`,
      `<button class="stat ${week ? "info" : ""}" data-action="view" data-v="agenda"><span class="n">${week}</span><span class="l">Próximos 7 dias</span></button>`,
      `<button class="stat ${sem ? "warn" : ""}" data-action="view" data-v="agenda"><span class="n">${sem}</span><span class="l">Sem próximo passo</span></button>`,
    ].join("");
    const badge = late + today;
    $("#agenda-badge").innerHTML = badge ? `<span class="badge">${badge}</span>` : "";
  }

  function filtered() {
    const f = state.filter;
    const q = f.q.trim().toLowerCase();
    return Array.from(state.projects.entries())
      .map(([id, p]) => Object.assign({ id }, p))
      .filter((p) => f.tipo === "todos" || p.tipo === f.tipo)
      .filter((p) => f.status === "todos" || (f.status === "ativos" ? !CLOSED.has(p.status) : p.status === f.status))
      .filter((p) => {
        if (!q) return true;
        const hay = [p.titulo, p.cliente, p.fazenda, p.cidade, p.contato, p.produto, p.versaoSw, p.versaoHw, p.release, p.engenharia]
          .concat(...machinesOf(p).map((m) => [m.fabricante, m.modelo, m.ano, m.serie, m.produto, m.versaoSw, m.versaoHw, m.nome, m.local])).join(" ").toLowerCase();
        return hay.includes(q);
      })
      .sort((a, b) => {
        const ca = CLOSED.has(a.status) ? 1 : 0, cb = CLOSED.has(b.status) ? 1 : 0;
        if (ca !== cb) return ca - cb;
        const na = nextOf(a), nb = nextOf(b);
        const da = (na && na.prazo) || "9999", dbb = (nb && nb.prazo) || "9999";
        if (da !== dbb) return da < dbb ? -1 : 1;
        const r = (STATUS_RANK[a.status] ?? 9) - (STATUS_RANK[b.status] ?? 9);
        if (r) return r;
        return (b.updated || 0) - (a.updated || 0);
      });
  }

  function stageBar(p) {
    const si = stageIdx(p); const pendSet = new Set(p.etapasPend || []);
    return `<div class="sbar" aria-hidden="true">${stages(p).map((st, i) => `<i class="${i < si && pendSet.has(st.k) ? "pend" : i < si ? "on" : i === si ? "cur" : ""}"></i>`).join("")}</div>`;
  }
  function coverPlaceholder(p) {
    const ms = machinesOf(p);
    const t = p.tipo === "homologacao" ? p.cliente || (ms[0] ? machineLabel(p, ms[0], 0) : "") : p.produto || p.versaoSw;
    return `<span class="ph">${esc(t || (p.titulo || "").split(/[—-]/)[0])}</span>`;
  }
  function projectCard(p) {
    const nt = nextOf(p);
    const si = stageIdx(p);
    const nPend = pendingStages(p).length;
    const c = counts(p);
    const closed = CLOSED.has(p.status) || stageKey(p) === "encerrado";
    const nx = nt
      ? `<div class="nx">→ <b>${esc(nt.texto)}</b> · <span class="mono ${dueClass(nt.prazo)}">${fmtDate(nt.prazo)}</span></div>`
      : (closed ? `<div class="nx">Projeto encerrado</div>` : `<div class="nx today">Sem próximo passo</div>`);
    return `<button class="card" data-action="select" data-id="${esc(p.id)}">
      <div class="cover">${p.capa ? coverImg(p.capa) : coverPlaceholder(p)}
        <div class="badges"><span class="kind ${p.tipo === "validacao" ? "val" : "hom"}">${KIND[p.tipo] ? KIND[p.tipo].short : "?"}</span><span class="pill st-${esc(p.status)}">${esc(statusLabel(p.status))}</span></div>
      </div>
      <div class="card-body">
        <h3>${esc(p.titulo || "Sem nome")}</h3>
        <div class="sub">${esc(subline(p))}</div>
        ${machinesOf(p).length > 1 ? `<div class="msum">${esc(machinesSummary(p))}</div>` : ""}
        ${stageBar(p)}
        <div class="sl"><b>${esc(stageLabel(p))}</b><span class="n">${si + 1}/${stages(p).length}</span>${nPend ? `<span class="today">${nPend} pendente${nPend > 1 ? "s" : ""}</span>` : ""}${c.falha ? `<span class="late">${c.falha} falha${c.falha > 1 ? "s" : ""}</span>` : ""}</div>
        ${nx}
      </div>
    </button>`;
  }
  function boardView(rows) {
    const tipos = state.filter.tipo === "todos" ? ["homologacao", "validacao"] : [state.filter.tipo];
    return tipos.map((tp) => {
      const list = rows.filter((p) => p.tipo === tp);
      if (!list.length && state.filter.tipo === "todos") return "";
      const cols = JORNADA[tp].map((st) => {
        const inCol = list.filter((p) => stageKey(p) === st.k);
        return `<div class="col ${inCol.length ? "has" : ""}"><div class="col-h"><span>${esc(st.l)}</span><span class="ct">${inCol.length}</span></div>
          <div class="col-b">${inCol.map((p) => {
            const nt = nextOf(p); const nPend = pendingStages(p).length;
            return `<button class="mcard" data-action="select" data-id="${esc(p.id)}"><span class="th">${p.capa ? coverImg(p.capa) : ""}</span>
              <span><b>${esc(p.titulo || "Sem nome")}</b><span>${esc(p.cliente || p.produto || "")}</span>
              <span class="${nt ? dueClass(nt.prazo) : "today"}">${nt ? "→ " + esc(fmtDate(nt.prazo)) : "Sem próximo passo"}${nPend ? " · " + nPend + " pendente" + (nPend > 1 ? "s" : "") : ""}</span></span></button>`;
          }).join("") || `<div class="col-empty">—</div>`}</div></div>`;
      }).join("");
      return `<section class="board-group"><h2>${esc(KIND[tp].l)}</h2><div class="board">${cols}</div></section>`;
    }).join("");
  }
  function renderList() {
    const el = $("#items");
    document.querySelectorAll('[data-action="home-view"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.homeView)));
    if (!state.loaded) { el.innerHTML = `<div class="empty">Carregando projetos…</div>`; return; }
    const rows = filtered();
    if (!state.projects.size) {
      el.innerHTML = `<div class="panel empty"><strong>Nenhum projeto ainda</strong>Crie uma homologação em cliente ou uma validação de versão/hardware para começar a registrar a jornada.<button class="btn primary" data-action="new">+ Novo projeto</button></div>`;

    hydrateCovers();
  }

  function schedForm(prefix, p, opts) {
    const init = (opts && opts.initial) || null;
    const tipo = toLog((init && init.tipo) || (opts && opts.tipo) || "ligacao");
    const keep = opts && opts.keep;
    const prazo = (init && init.prazo) || addDays(7);
    const days = DAY_CHIPS.find((n) => addDays(n) === prazo) || 0;
    return `<div class="sched ${keep ? "off" : ""}" id="${prefix}-sched">
      <input type="hidden" id="${prefix}-none" value="0">
      <input type="hidden" id="${prefix}-keep" value="${keep ? "1" : "0"}">
      ${keep ? `<div class="quick"><button type="button" class="chip" data-action="sched-keep" data-prefix="${prefix}" aria-pressed="true">Manter o atual: ${esc(keep.texto)} · ${esc(fmtDate(keep.prazo))}</button><span>ou agende outro:</span></div>` : ""}
      <div class="sched-what" style="display:flex;flex-direction:column;gap:8px">
        <div class="row2 sched-row"><select class="field-in" id="${prefix}-tipo" data-sched-tipo="1" data-prefix="${prefix}" aria-label="Tipo de atividade">${REG_TIPOS.map((t) => `<option value="${t.v}" ${t.v === tipo ? "selected" : ""}>${t.l}</option>`).join("")}</select>
        <input class="field-in" id="${prefix}-texto" data-auto="${init ? "0" : "1"}" value="${esc(init ? init.texto : defaultNextText(p, tipo))}" placeholder="O que precisa ser feito…" aria-label="O que fazer"></div>
      </div>
      <div class="quick sched-when">Quando:
        ${DAY_CHIPS.map((n) => `<button type="button" class="chip" data-action="sched-days" data-prefix="${prefix}" data-v="${n}" aria-pressed="${!keep && n === days}">${n} dias</button>`).join("")}
        <input class="field-in mono" type="date" id="${prefix}-prazo" data-prefix="${prefix}" value="${esc(prazo)}" aria-label="Data">
        ${opts && opts.allowNone ? `<button type="button" class="chip" data-action="sched-none" data-prefix="${prefix}" aria-pressed="false">Sem próximo passo</button>` : ""}
      </div>
    </div>`;
  }


  function nextBlock(p) {
    const nt = nextOf(p);
    const tel = p.tipo === "homologacao" && (p.contato || p.contatoTel) ? [p.contato, p.contatoTel].filter(Boolean).join(" · ") : (p.tipo === "validacao" && p.engenharia ? p.engenharia : "");
    let top;
    if (nt) {
      const dc = dueClass(nt.prazo);
      top = `<div class="next-card ${dc}">
        <div class="nc-when"><span class="big">${esc(fmtDate(nt.prazo).slice(0, 5))}</span><span class="rel">${esc(relDay(nt.prazo))}</span></div>
        <div class="nc-body">
          <div><span class="tag ${esc(nt.tipo)}">${esc(actLabel(nt.tipo))}</span></div>
          <strong>${esc(nt.texto)}</strong>
          ${machTags(p, nt.maquinas)}
          ${attHtml(nt.anexos)}
          ${tel ? `<span class="nc-meta mono">${esc(tel)}</span>` : ""}
          <span class="nc-meta">Agendado${nt.autor ? ` por <span data-uid="${esc(nt.autor)}">…</span>` : ""} em ${esc(fmtDate(nt.criado))}</span>
        </div>
        <div class="nc-actions">
          <button class="btn primary" data-action="reg-open" data-conclude="1">Feito — registrar como foi</button>
          <button class="btn" data-action="next-open" data-edit="1">Editar</button>
          <button class="btn ghost danger" data-action="next-drop">Remover</button>
        </div>
      </div>`;
    } else {
      const closed = CLOSED.has(p.status) || stageKey(p) === "encerrado";
      const hint = FOLLOWUP_STAGES.has(stageKey(p)) ? "Projeto em acompanhamento: agende o próximo contato para ver como o cliente está." : closed ? "Projeto encerrado." : "Defina o que precisa ser feito e quando, por exemplo “entrar em contato em 7 dias”.";
      top = `<div class="box next-empty"><strong>Nenhum próximo passo agendado</strong><p class="hint">${esc(hint)}</p>
        <div><button class="btn primary" data-action="next-open">+ Agendar próximo passo</button></div></div>`;

  function machTags(p, ids) {
    if (!ids || !ids.length) return "";
    const ms = machinesOf(p);
    const tags = ids.map((id) => { const i = ms.findIndex((m) => m.id === id); return i >= 0 ? machineLabel(p, ms[i], i) : ""; }).filter(Boolean);
    return tags.length ? `<span class="mtags">${tags.map((t) => `<span class="mtag">${esc(t)}</span>`).join("")}</span>` : "";
  }
  function tabHistorico(p) {
    const diario = (p.diario || []).map((e, i) => Object.assign({ _i: i }, e)).sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : b._i - a._i));
    const log = diario.length
      ? diario.map((e) => {
          const tipo = e.tipo || "nota";
          return `<div class="entry ${e.auto ? "auto" : ""}"><span class="when">${esc(fmtDate(e.data))}${e.autor ? `<span class="by" data-uid="${esc(e.autor)}"></span>` : ""}</span>
          <span class="what"><span class="tag ${esc(tipo)}">${esc(LOG_LABEL[tipo] || "Nota")}</span>${esc(e.texto)}${e.prazoOriginal ? `<span class="due-was">✓ próximo passo concluído · previsto para ${esc(fmtDate(e.prazoOriginal))}</span>` : ""}${machTags(p, e.maquinas)}${attHtml(e.anexos)}</span>
          ${e.auto && ((e.tipo !== "etapa" && e.tipo !== "maquina") || e.texto === "Projeto criado") ? "<span></span>" : `<button class="icon-btn" data-action="log-del" data-entry="${esc(e.id)}" aria-label="Apagar registro" title="Apagar registro">×</button>`}</div>`;
        }).join("")
      : `<div class="entry"><span class="when">—</span><span class="what" style="color:var(--muted)">Nenhum registro ainda. Use “Registrar atividade” para anotar uma visita, ligação ou teste.</span><span></span></div>`;
    return `<div class="hist-head"><p class="hint">Linha do tempo: o próximo passo no topo e, abaixo, tudo o que já foi feito, do mais recente para o mais antigo.</p><button class="btn primary" data-action="reg-open">+ Registrar atividade</button></div>
      <div class="tl-next"><div class="sec-sub">Próximo passo</div>${nextBlock(p)}</div>
      <div class="sec-sub">Já feito</div>
      <div class="log">${log}</div>`;
  }

  function checklistHtml(p, m) {
    const c = countList(m.checklist);
    const w = (n) => (c.total ? ((n / c.total) * 100).toFixed(1) : 0) + "%";
    const groups = [];
    const byGroup = {};
    (m.checklist || []).forEach((it) => { const g = it.grupo || "Geral"; if (!byGroup[g]) { byGroup[g] = []; groups.push(g); } byGroup[g].push(it); });
    const mid = esc(m.id);
    const ck = groups.map((g) => `<div class="group"><div class="group-h">${esc(g)}</div>${byGroup[g].map((it) => {
      const showNote = state.openNotes.has(it.id) || it.nota || it.status === "falha";
      const b = (v, l, cls) => `<button data-action="ck-set" data-mid="${mid}" data-item="${esc(it.id)}" data-v="${v}" class="${it.status === v ? cls : ""}" aria-pressed="${it.status === v}">${l}</button>`;
      return `<div class="ck s-${it.status === "falha" ? "fail" : it.status}">
        <span class="txt">${esc(it.texto)}</span>
        <span class="tri" role="group" aria-label="Resultado">${b("ok", "OK", "on-ok")}${b("falha", "Falha", "on-fail")}${b("na", "N.A.", "on-na")}</span>
        <span><button class="icon-btn ${it.nota ? "has" : ""}" data-action="ck-note" data-mid="${mid}" data-item="${esc(it.id)}" title="Observação" aria-label="Observação">✎</button><button class="icon-btn" data-action="ck-del" data-mid="${mid}" data-item="${esc(it.id)}" title="Remover item" aria-label="Remover item">×</button></span>
        ${showNote ? `<div class="note"><input class="field-in" id="nt-${esc(it.id)}" data-note="${esc(it.id)}" data-mid="${mid}" value="${esc(it.nota)}" placeholder="${it.status === "falha" ? "Descreva a falha, como reproduzir, nº do ticket…" : "Observação"}"></div>` : ""}
      </div>`;
    }).join("")}</div>`).join("");
    const groupOpts = Array.from(new Set(groups.concat(Object.keys(TEMPLATES[p.tipo] || {})).concat(["Geral"]))).map((g) => `<option>${esc(g)}</option>`).join("");
    return `${c.total ? `<div class="prog">
        <div class="bar" aria-hidden="true"><i class="c-ok" style="width:${w(c.ok)}"></i><i class="c-fail" style="width:${w(c.falha)}"></i><i class="c-na" style="width:${w(c.na)}"></i></div>
        <div class="legend"><span><i class="dot c-ok"></i>OK <b>${c.ok}</b></span><span><i class="dot c-fail"></i>Falha <b>${c.falha}</b></span><span><i class="dot c-na"></i>N.A. <b>${c.na}</b></span><span><i class="dot c-pend"></i>Pendente <b>${c.pendente}</b></span></div>
      </div>` : `<div><button class="btn sm" data-action="ck-template" data-mid="${mid}">Usar checklist padrão</button></div>`}
      <div>${ck}</div>
      <div class="add-row">
        <input class="field-in" id="ck-new" data-mid="${mid}" placeholder="Novo item de teste…" aria-label="Novo item de teste">
        <select class="field-in" id="ck-group" aria-label="Grupo">${groupOpts}</select>
        <button class="btn" data-action="ck-add" data-mid="${mid}">Adicionar</button>
      </div>`;
  }

  function machineEntries(p, mid) {
    return (p.diario || []).map((e, i) => Object.assign({ _i: i }, e)).filter((e) => (e.maquinas || []).includes(mid))
      .sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : b._i - a._i));
  }
  function tabMaquinas(p) {
    const cfg = machCfg(p);
    const ms = machinesOf(p);
    const list = ms.map((m, i) => {
      const open = state.openMachine === m.id;
      const c = countList(m.checklist);
      const sub = (p.tipo === "homologacao" ? [m.serie && "Série " + m.serie, m.produto, m.versaoSw && "SW " + m.versaoSw] : [m.serie && "Série " + m.serie, m.versaoHw && "HW " + m.versaoHw, m.local]).filter(Boolean).join(" · ");
      const w = (n) => (c.total ? ((n / c.total) * 100).toFixed(1) : 0) + "%";
      const nAct = machineEntries(p, m.id).length;
      let body = "";
      if (open) {
        const fields = cfg.fields.map((f) => {
          const v = m[f.k] == null ? "" : m[f.k];
          const idf = "mf-" + m.id + "-" + f.k;
          if (f.t === "area") return `<label class="wide" for="${idf}">${f.l}<textarea class="field-in" id="${idf}" data-mfield="${f.k}" data-mid="${esc(m.id)}">${esc(v)}</textarea></label>`;
          return `<label for="${idf}">${f.l}<input class="field-in ${f.mono ? "mono" : ""}" id="${idf}" data-mfield="${f.k}" data-mid="${esc(m.id)}" value="${esc(v)}"></label>`;
        }).join("");
        const acts = machineEntries(p, m.id);
        body = `<div class="mach-b">
          <div class="mach-row">
            <label for="ms-${esc(m.id)}">Situação<select class="field-in" id="ms-${esc(m.id)}" data-msit="1" data-mid="${esc(m.id)}">${cfg.sit.map((x) => `<option value="${x.v}" ${m.situacao === x.v ? "selected" : ""}>${x.l}</option>`).join("")}</select></label>
            <button class="btn sm" data-action="reg-open" data-mid="${esc(m.id)}">+ Registrar atividade nesta ${cfg.um}</button>
            <span class="spacer"></span>
            <button class="btn sm ghost danger" data-action="m-del-ask" data-mid="${esc(m.id)}">Remover ${cfg.um}</button>
          </div>
          ${state.mDelAsk === m.id ? `<div class="confirm">Remover “${esc(machineLabel(p, m, i))}” e o checklist dela? As atividades continuam no histórico do cliente. <button class="btn sm danger" data-action="m-del-yes" data-mid="${esc(m.id)}">Sim, remover</button><button class="btn sm ghost" data-action="m-del-no">Cancelar</button></div>` : ""}
          <div class="sec-sub">Dados</div>

          <div class="sec-sub">Atividades nesta ${cfg.um}</div>
          ${acts.length ? `<div class="log">${acts.map((e) => `<div class="entry"><span class="when">${esc(fmtDate(e.data))}</span><span class="what"><span class="tag ${esc(e.tipo || "nota")}">${esc(LOG_LABEL[e.tipo || "nota"] || "Nota")}</span>${esc(e.texto)}${attHtml(e.anexos)}</span><span></span></div>`).join("")}</div>` : `<p class="hint">Nenhuma atividade ligada a esta ${cfg.um}. Ao registrar uma atividade, marque em quais ${cfg.ums} você trabalhou.</p>`}
        </div>`;
      }
      return `<div class="mach ${open ? "open" : ""}">
        <button class="mach-h" data-action="m-toggle" data-mid="${esc(m.id)}" aria-expanded="${open}">
          <span class="mach-n mono">${i + 1}</span>
          <span class="mach-t"><b>${esc(machineLabel(p, m, i))}</b><span>${esc(sub || "Abrir para ver dados e checklist")}</span></span>
          <span class="mach-s">
            <span class="pill ${SIT_CLS[m.situacao] || "st-planejado"}">${esc(sitLabel(p, m.situacao))}</span>
            ${c.total ? `<span class="mini" aria-hidden="true"><i class="c-ok" style="width:${w(c.ok)}"></i><i class="c-fail" style="width:${w(c.falha)}"></i><i class="c-na" style="width:${w(c.na)}"></i></span><span class="mono ${c.falha ? "late" : ""}">${c.falha ? c.falha + " falha" + (c.falha > 1 ? "s" : "") : c.ok + c.na + "/" + c.total}</span>` : ""}
            ${nAct ? `<span class="mono">${nAct} ativ.</span>` : ""}
          </span>
          <span class="chev" aria-hidden="true">${open ? "▾" : "▸"}</span>
        </button>${body}</div>`;
    }).join("");
    return `<div class="hist-head"><p class="hint">${p.tipo === "homologacao" ? "Cada máquina instalada neste cliente, com situação e checklist próprios." : "Cada unidade em teste, com situação e checklist próprios."}</p><button class="btn primary" data-action="m-add">${cfg.add}</button></div>
      ${ms.length ? `<div class="machines">${list}</div>` : `<div class="box next-empty"><strong>Nenhuma ${cfg.um} cadastrada</strong><p class="hint">${p.tipo === "homologacao" ? "Adicione cada máquina que vai receber nossos produtos neste cliente." : "Adicione cada unidade que está sendo testada."}</p><div><button class="btn primary" data-action="m-add">${cfg.add}</button></div></div>`}`;
  }

  function tabDados(p) {
    const fields = (FIELDS[p.tipo] || []).map((f) => {
      const v = p[f.k] == null ? "" : p[f.k];
      const idf = "fd-" + f.k;
      if (f.t === "area") return `<label class="wide" for="${idf}">${f.l}<textarea class="field-in" id="${idf}" data-field="${f.k}">${esc(v)}</textarea></label>`;
      return `<label for="${idf}">${f.l}<input class="field-in ${f.mono ? "mono" : ""}" id="${idf}" data-field="${f.k}" type="${f.t === "date" ? "date" : f.t === "number" ? "number" : "text"}" value="${esc(v)}"></label>`;
    }).join("");
    return `<div class="grid">${fields}</div>`;
  }

  function journeySide(p) {
    const si = stageIdx(p);
    const pendSet = new Set(p.etapasPend || []);
    const steps = stages(p).map((s, i) => {
      const since = stageSince(p, s.k);
      const isPend = i < si && pendSet.has(s.k);
      const cls = isPend ? "pend" : i < si ? "done" : i === si ? "cur" : "";
      const sub = isPend ? `<span class="pl">Pendente</span>` : since && i <= si ? `<span class="sd">${fmtDate(since)}</span>` : "";
      return `<li class="vstep ${cls}"><button data-action="stage" data-v="${s.k}" ${i === si ? 'aria-current="step"' : ""} title="${i === si ? "Concluir esta etapa" : "Abrir opções desta etapa"}">
        <span class="rail"><span class="dotn"></span><span class="ln"></span></span><span class="lb">${esc(s.l)}</span>${sub}</button></li>`;
    }).join("");
    const pendNow = pendingStages(p);
    let panel = "";
    if (state.stagePanel && state.stagePanel === stageKey(p)) {
      const st = stages(p); const nx = st[si + 1];
      panel = `<div class="stage-panel"><div class="sp-q"><b>${esc(st[si].l)}</b> — etapa atual</div>
        ${nx ? `<div class="sp-acts" style="justify-content:flex-start">
          <button class="btn sm primary" data-action="sp-advance" data-v="${nx.k}">Concluir etapa</button>
          <button class="btn sm" data-action="sp-advance" data-v="${nx.k}" data-pendk="${st[si].k}">Deixar pendente e seguir</button>
          <button class="btn sm ghost" data-action="sp-cancel">Fechar</button></div>
          <p class="hint">O projeto passa para “${esc(nx.l)}”.</p>` : `<p class="hint">Esta é a última etapa.</p><div class="sp-acts"><button class="btn sm ghost" data-action="sp-cancel">Fechar</button></div>`}</div>`;
    } else if (state.stagePanel && state.stagePanel !== stageKey(p)) {
      const st = stages(p); const ti = st.findIndex((s) => s.k === state.stagePanel);
      if (ti > si) {
        const rows = st.slice(si, ti).map((s) => {
          const v = pendSet.has(s.k) ? "pend" : "ok";
          return `<div class="sp-row" data-k="${s.k}"><span>${esc(s.l)}</span><div class="seg" role="group" aria-label="${esc(s.l)}">
            <button type="button" data-action="sp-mark" data-v="ok" aria-pressed="${v === "ok"}">Concluída</button>
            <button type="button" data-action="sp-mark" data-v="pend" aria-pressed="${v === "pend"}">Pendente</button></div></div>`;
        }).join("");
        panel = `<div class="stage-panel"><div class="sp-q">Avançar para <b>${esc(st[ti].l)}</b>. Como ficaram as etapas anteriores?</div>${rows}
          <div class="row-end"><button class="btn sm ghost" data-action="sp-cancel">Cancelar</button><button class="btn sm primary" data-action="sp-advance" data-v="${st[ti].k}">Avançar</button></div></div>`;
      } else if (ti >= 0) {
        const isPend = pendSet.has(st[ti].k);
        panel = `<div class="stage-panel"><div class="sp-q"><b>${esc(st[ti].l)}</b> — ${isPend ? "pendente" : "concluída"}</div>
          <div class="sp-acts">
            ${isPend ? `<button class="btn sm primary" data-action="stage-done" data-v="${st[ti].k}">Marcar como concluída</button>` : `<button class="btn sm" data-action="stage-pend" data-v="${st[ti].k}">Marcar como pendente</button>`}
            <button class="btn sm" data-action="sp-back" data-v="${st[ti].k}">Voltar o projeto para esta etapa</button>
            <button class="btn sm ghost" data-action="sp-cancel">Fechar</button></div></div>`;
      }
    }
    const open = state.jrOpen === null ? !window.matchMedia("(max-width: 900px)").matches : state.jrOpen;
    return `<details class="side-box jr-fold" id="jr-fold" ${open ? "open" : ""}>
      <summary><span class="side-h">Jornada</span><span class="side-cur">${esc(stageLabel(p))} <span class="mono">${si + 1}/${stages(p).length}</span></span></summary>
      <ol class="vsteps">${steps}</ol>
      ${pendNow.length ? `<div class="pend-list"><b>Pendente:</b>${pendNow.map((s) => `<span>${esc(s.l)}</span><button class="btn sm" data-action="stage-done" data-v="${s.k}">Concluir</button>`).join("")}</div>` : ""}
      ${panel}
      <p class="hint">Clique numa etapa para concluir, avançar ou marcar como pendente.</p>
    </details>`;
  }

  function contactSide(p) {

  function openRegister(o) {
    o = o || {};
    const p = state.projects.get(state.selectedId); if (!p) return;
    const nt = nextOf(p);
    if (state.reg || state.nextModal) closeRegister();
    clearAtt();
    if (o.edit && nt) {
      state.reg = { edit: true, conclude: false, tipo: toLog(nt.tipo), data: nt.prazo || addDays(7), texto: nt.texto || "", maquinas: (nt.maquinas || []).slice() };
      state.att = (nt.anexos || []).map((f) => ({ key: rid(), meta: f }));
    } else if (o.conclude && nt) {
      state.reg = { conclude: true, tipo: toLog(nt.tipo), data: todayISO(), texto: "", maquinas: (nt.maquinas || []).slice() };
    } else if (o.future) {
      state.reg = { conclude: false, tipo: "ligacao", data: addDays(7), texto: defaultNextText(p, "ligacao"), textoAuto: true, maquinas: o.mid ? [o.mid] : [] };
    } else {
      state.reg = { conclude: false, tipo: "visita", data: todayISO(), texto: "", maquinas: o.mid ? [o.mid] : [] };
    }
    renderRegister();
    setTimeout(() => { const t = $("#reg-text"); if (t) { t.focus(); if (state.reg && state.reg.textoAuto) t.select(); } }, 0);
  }
  function captureRegister() {
    if (!state.reg) return;
    const d = $("#reg-date"), t = $("#reg-text");
    if (d) state.reg.data = d.value || todayISO();
    if (t) state.reg.texto = t.value;
  }
  function closeRegister() { state.reg = null; state.nextModal = null; clearAtt(); const m = $("#modal"); m.hidden = true; m.innerHTML = ""; }
  const REG_DAYS = [{ n: -1, l: "Ontem" }, { n: 0, l: "Hoje" }, { n: 1, l: "Amanhã" }, { n: 7, l: "Em 7 dias" }, { n: 15, l: "Em 15 dias" }, { n: 30, l: "Em 30 dias" }];
  function renderRegister() {
    const m = $("#modal");
    const p = state.projects.get(state.selectedId);
    if (!state.reg || !p) { closeRegister(); return; }
    const r = state.reg;
    const nt = nextOf(p);
    const future = r.data > todayISO();
    const tp = REG_TIPOS.find((x) => x.v === r.tipo) || REG_TIPOS[0];
    let q = 0; const num = () => ++q;
    const title = r.edit ? "Editar próximo passo" : future ? "Agendar atividade" : "Registrar atividade";

        <div class="type-grid" role="group" aria-label="Tipo de atividade">${REG_TIPOS.map((t) => `<button type="button" data-action="reg-tipo" data-v="${t.v}" aria-pressed="${t.v === r.tipo}"><b>${t.l}</b><span>${future ? t.df : t.d}</span></button>`).join("")}</div>

        ${future ? `<div class="future-box">Data futura: vai aparecer como <b>próximo passo</b> no topo do histórico${nt && !r.edit ? `, no lugar de “${esc(nt.texto)}” (${esc(fmtDate(nt.prazo))})` : ""}.</div>`
          : r.edit ? `<div class="future-box">Data de hoje ou passada: o próximo passo será registrado como <b>feito</b> no histórico.</div>` : ""}
        <div class="q"><span class="qn">${num()}</span>${future ? "Detalhes" : "Como foi?"}</div>
        <textarea class="field-in" id="reg-text" rows="${future ? 2 : 4}" placeholder="${esc(future ? "O que precisa ser feito, quem procurar, o que levar…" : tp.ph)}" aria-label="${future ? "Detalhes" : "Como foi"}">${esc(r.texto)}</textarea>
        ${nt && !future && !r.edit ? `<label class="conclude"><input type="checkbox" id="reg-conclude" ${r.conclude ? "checked" : ""}><span>Isso conclui o próximo passo: <b>${esc(nt.texto)}</b> <span class="mono">(${esc(fmtDate(nt.prazo))})</span></span></label>` : ""}

        ${future ? "" : `<div class="q"><span class="qn">${num()}</span>E o próximo passo?</div>
        ${schedForm("rg", p, { allowNone: true, tipo: "ligacao", keep: nt && !r.conclude && !r.edit ? nt : null })}`}

        <div class="modal-f"><span class="modal-err" id="modal-err" role="alert"></span><button class="btn ghost" data-action="reg-close">Cancelar</button><button class="btn primary" data-action="reg-save" id="reg-save-btn">${future && !r.edit ? "Agendar" : "Salvar"}</button></div>

  async function saveRegister() {
    const id = state.selectedId; const p = state.projects.get(id); if (!p || !state.reg || state.saving) return;
    captureRegister();
    const r = state.reg;
    const nt = nextOf(p);
    const future = r.data > todayISO();
    const texto = (r.texto || "").trim();
    const me = state.myId || "";
    const btn = $("#reg-save-btn");
    const label = btn ? btn.textContent : "Salvar";
    let n = null;
    let conclude = false;
    if (future) {
      if (!texto) { toast("Escreva o que vai ser feito."); $("#reg-text").focus(); return; }
    } else {
      conclude = r.edit ? !!nt : !!(nt && $("#reg-conclude") && $("#reg-conclude").checked);
      if (!texto && !conclude && !state.att.length) { toast("Escreva como foi."); $("#reg-text").focus(); return; }
      n = readSched("rg"); if (n === false) return;
    }
    let anexos = [];
    if (state.att.length) {
      state.saving = true; if (btn) btn.disabled = true;
      try { anexos = await uploadPending(id, btn); }
      catch (e) { state.saving = false; if (btn) { btn.disabled = false; btn.textContent = label; } toast(attError(e)); return; }
      state.saving = false;
    }
    const removed = state.attRemoved.slice();
    if (future) {
      const keepOld = r.edit && nt;
      const step = { id: keepOld ? nt.id : rid(), tipo: r.tipo, texto, prazo: r.data, criado: keepOld ? nt.criado : todayISO(), autor: keepOld ? (nt.autor || me) : me };
      if ((r.maquinas || []).length) step.maquinas = r.maquinas.slice();
      if (anexos.length) step.anexos = anexos;
      const replacedFiles = !r.edit && nt ? (nt.anexos || []) : [];
      p.proximo = step;
      const auto = applyAutomation(p, { tipo: null, maquinas: [], next: step });
      closeRegister();
      state.tab = "historico";
      changed(id, ["proximo"].concat(auto.fields), { detail: true, now: true });
      removeFiles(removed.concat(replacedFiles));
      const base = r.edit ? "Próximo passo atualizado." : `Agendado para ${fmtDate(step.prazo)}.`;
      toast(auto.msgs.length ? `${base} Atualizado: ${auto.msgs.join(", ")}.` : base);
      return;
    }
    const entry = { id: rid(), data: r.data || todayISO(), tipo: r.tipo, texto: conclude && !r.edit ? nt.texto + (texto ? "\n" + texto : "") : texto, autor: me };
    if (conclude) { entry.prazoOriginal = nt.prazo; if (!r.edit) anexos = (nt.anexos || []).concat(anexos); }
    if ((r.maquinas || []).length) entry.maquinas = r.maquinas.slice();
    if (anexos.length) entry.anexos = anexos;
    p.diario = (p.diario || []).concat([entry]);
    const fields = ["diario"];
    if (n !== "keep") { p.proximo = n || null; fields.push("proximo"); }
    else if (conclude) { p.proximo = null; fields.push("proximo"); }
    const auto = applyAutomation(p, { tipo: r.tipo, maquinas: entry.maquinas || [], next: n && n !== "keep" ? n : null });
    auto.fields.forEach((f) => { if (!fields.includes(f)) fields.push(f); });
    closeRegister();
    state.tab = "historico";
    changed(id, fields, { detail: true, now: true });
    removeFiles(removed);
    const base = n && n !== "keep" ? `Registrado. Próximo passo em ${fmtDate(n.prazo)}.` : "Registrado no histórico.";
    toast(auto.msgs.length ? `${base} Atualizado: ${auto.msgs.join(", ")}.` : base);
  }

  function attError(e) {
    if (e && e.code === "no_bucket") return "Falta configurar o armazenamento de anexos no Supabase (supabase/003_anexos.sql).";
    if (e && e.code === "not_supported") return "Neste modo só é possível anexar fotos.";
    return "Não foi possível enviar os anexos. Verifique a conexão e tente de novo." + (e && e.message ? ` (${e.message})` : "");
  }

  function renderAgenda() {
    const el = $("#agenda");
    if (state.view !== "agenda") return;

    let items = act.filter(([, p]) => nextOf(p)).map(([id, p]) => ({ id, p, n: nextOf(p) }));
    if (state.agendaTipo === "contato") items = items.filter((x) => CONTACT_TYPES.has(x.n.tipo));
    items.sort((a, b) => (a.n.prazo < b.n.prazo ? -1 : a.n.prazo > b.n.prazo ? 1 : 0));
    const sem = act.filter(([, p]) => !nextOf(p));
    const row = (x) => {
      const p = x.p, n = x.n;

      </div>`;
    };

      { l: "Atrasados", cls: "late", f: (d) => d !== null && d < 0 },
      { l: "Hoje", cls: "today", f: (d) => d === 0 },

      { l: "Mais adiante", cls: "", f: (d) => d !== null && d > 7 },

        <button class="btn sm" data-action="open" data-id="${esc(id)}" data-sched="1">Agendar</button></div>`).join("")}</div>`;
    }
    el.innerHTML = `<div class="agenda">
      <div class="agenda-head"><h2>Agenda</h2>
        <div class="seg" role="group" aria-label="Filtro">
          <button data-action="agenda-tipo" data-v="todas" aria-pressed="${state.agendaTipo === "todas"}">Todos os passos</button>

      <p class="hint">Cada projeto ativo tem um próximo passo. Abra o projeto para concluir e agendar o seguinte.</p>
      ${body || `<div class="empty"><strong>Nada agendado</strong>Abra um projeto e agende o próximo passo, como “entrar em contato em 7 dias”.</div>`}

  /* ---------- Report ---------- */
  function report(p) {
    const c = counts(p);
    const L = [];
    L.push(`${(KIND[p.tipo] || {}).l || "Projeto"}: ${p.titulo || "Sem nome"}`.toUpperCase());
    const pr = pendingStages(p);
    L.push(`Etapa: ${stageLabel(p)}${pr.length ? " (pendente: " + pr.map((s) => s.l).join(", ") + ")" : ""} | Status: ${statusLabel(p.status)} | Prioridade: ${(PRIOR.find((x) => x.v === p.prioridade) || PRIOR[1]).l}`);
    L.push("");
    (FIELDS[p.tipo] || []).forEach((f) => { if (p[f.k]) L.push(`${f.l}: ${f.t === "date" ? fmtDate(p[f.k]) : p[f.k]}`); });
    const nt = nextOf(p);
    if (nt) L.push("", `PRÓXIMO PASSO: ${nt.texto} (${fmtDate(nt.prazo)})`);
    const ms = machinesOf(p);
    if (ms.length) {
